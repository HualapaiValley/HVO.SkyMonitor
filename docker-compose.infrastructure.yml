# Infrastructure services for HVO.SkyMonitor
# Started automatically when the devcontainer boots (see .devcontainer/post-start.sh)

services:
  postgres:
    image: postgres:17-alpine
    container_name: skymonitor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skymonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skymonitor_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-skymonitordb}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/host-data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skymonitor} -d ${POSTGRES_DB:-skymonitordb}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - skymonitor-network

  minio:
    image: minio/minio:latest
    container_name: skymonitor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
      - ${MINIO_DATA_DIR:-./data/minio}:/host-data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - skymonitor-network

  redis:
    image: redis:7-alpine
    container_name: skymonitor-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ${REDIS_DATA_DIR:-./data/redis}:/host-data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - skymonitor-network

  smtp:
    image: axllent/mailpit:latest
    container_name: skymonitor-smtp
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${SMTP_WEB_PORT:-8025}:8025"
    restart: unless-stopped
    networks:
      - skymonitor-network

volumes:
  postgres-data:
    name: skymonitor-postgres-data
  minio-data:
    name: skymonitor-minio-data
  redis-data:
    name: skymonitor-redis-data

networks:
  skymonitor-network:
    name: skymonitor-network
    driver: bridge

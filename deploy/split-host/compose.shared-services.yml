services:
  sqlserver:
    image: ${SQLSERVER_IMAGE:?digest reference required}
    environment:
      ACCEPT_EULA: "Y"
    command: ["/bin/bash", "-c", "export MSSQL_SA_PASSWORD=$$(cat /run/hvo-secrets/SQLSERVER_PASSWORD); exec /opt/mssql/bin/sqlservr"]
    ports: ["${SQLSERVER_PORT:?port required}:1433"]
    volumes:
      - ${HVO_CONFIG_ROOT:?config root required}/secrets:/run/hvo-secrets:ro
      - sql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=$$(cat /run/hvo-secrets/SQLSERVER_PASSWORD) /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    cpus: ${HVO_CPUS:-2}
    mem_limit: ${HVO_MEMORY:-2G}

  sql-provision:
    image: ${SQLSERVER_IMAGE:?digest reference required}
    profiles: [provision]
    depends_on:
      sqlserver: { condition: service_healthy }
    environment:
      SQL_DATABASE: ${SQL_DATABASE:?database required}
      SQL_ADMIN_USER: ${SQL_ADMIN_USER:?admin user required}
      SQL_INITIALIZER_USER: ${SQL_INITIALIZER_USER:?initializer user required}
      SQL_RUNTIME_USER: ${SQL_RUNTIME_USER:?runtime user required}
      SQL_PROVISION_PHASE: ${SQL_PROVISION_PHASE:-before}
    volumes:
      - ${HVO_CONFIG_ROOT:?config root required}/secrets:/run/hvo-secrets:ro
      - ${HVO_CONFIG_ROOT}/sql:/run/hvo-sql:ro
    entrypoint: ["/bin/bash", "/run/hvo-sql/provision.sh"]
    restart: "no"

  redis:
    image: ${REDIS_IMAGE:?digest reference required}
    command: ["redis-server", "/run/hvo-private/redis.conf"]
    ports: ["${REDIS_PORT:?port required}:6379"]
    volumes:
      - ${HVO_CONFIG_ROOT}/secrets:/run/hvo-secrets:ro
      - ${HVO_CONFIG_ROOT}/private:/run/hvo-private:ro
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/hvo-secrets/REDIS_PASSWORD) redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 12

  redis-provision:
    image: ${REDIS_IMAGE:?digest reference required}
    profiles: [provision]
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_RUNTIME_USER: ${REDIS_RUNTIME_USER:?runtime user required}
      REDIS_PREFIX: ${REDIS_PREFIX:?prefix required}
    volumes:
      - ${HVO_CONFIG_ROOT:?config root required}/secrets:/run/hvo-secrets:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf 'ACL SETUSER %s reset on >%s ~%s* +get +set +del +unlink +exists +expire +pexpire +ttl +pttl +hget +hmget +hset +hdel +eval +evalsha +script|load +ping +echo +client|setname +client|setinfo\n'
        "$$REDIS_RUNTIME_USER" "$$(cat /run/hvo-secrets/REDIS_RUNTIME_PASSWORD)" "$$REDIS_PREFIX" |
        REDISCLI_AUTH="$$(cat /run/hvo-secrets/REDIS_PASSWORD)"
        redis-cli -h redis --no-auth-warning
    restart: "no"

  minio:
    image: ${MINIO_IMAGE:?digest reference required}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/hvo-secrets/MINIO_ACCESS_KEY
      MINIO_ROOT_PASSWORD_FILE: /run/hvo-secrets/MINIO_SECRET_KEY
    ports: ["${MINIO_PORT:?port required}:9000"]
    volumes:
      - ${HVO_CONFIG_ROOT}/secrets:/run/hvo-secrets:ro
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12

  minio-provision:
    image: ${MINIO_CLIENT_IMAGE:?digest reference required}
    user: "${HVO_RUNTIME_UID:?runtime uid required}:${HVO_RUNTIME_GID:?runtime gid required}"
    profiles: [provision]
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ARTIFACT_BUCKET: ${MINIO_ARTIFACT_BUCKET:?artifact bucket required}
      MINIO_DIAGNOSTICS_BUCKET: ${MINIO_DIAGNOSTICS_BUCKET:?diagnostics bucket required}
    volumes:
      - ${HVO_CONFIG_ROOT}/minio:/run/hvo-minio:ro
      - ${HVO_CONFIG_ROOT}/private/mc:/run/hvo-mc:ro
      - ${HVO_CONFIG_ROOT}/minio-output:/run/hvo-output
    entrypoint: ["/bin/sh", "/run/hvo-minio/provision.sh"]
    restart: "no"

  mailpit:
    image: ${MAILPIT_IMAGE:?digest reference required}
    profiles: [test-smtp]
    ports: ["${SMTP_PORT:?port required}:1025"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  sql-data:
    labels: { io.hvoskymonitor.run-id: "${HVO_RUN_ID:?run id required}", io.hvoskymonitor.inventory-sha256: "${HVO_INVENTORY_SHA256:?inventory hash required}" }
  redis-data:
    labels: { io.hvoskymonitor.run-id: "${HVO_RUN_ID:?run id required}", io.hvoskymonitor.inventory-sha256: "${HVO_INVENTORY_SHA256:?inventory hash required}" }
  minio-data:
    labels: { io.hvoskymonitor.run-id: "${HVO_RUN_ID:?run id required}", io.hvoskymonitor.inventory-sha256: "${HVO_INVENTORY_SHA256:?inventory hash required}" }

networks:
  default:
    labels:
      io.hvoskymonitor.run-id: "${HVO_RUN_ID:?run id required}"
      io.hvoskymonitor.inventory-sha256: "${HVO_INVENTORY_SHA256:?inventory hash required}"

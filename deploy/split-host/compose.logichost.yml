services:
  logic-init:
    container_name: ${HVO_CONTAINER_NAME:?container name required}-init
    image: ${LOGICHOST_IMAGE:?digest reference required}
    profiles: [initialize]
    command: ["--host-mode=database-initialize"]
    user: "${HVO_RUNTIME_UID:?runtime uid required}:${HVO_RUNTIME_GID:?runtime gid required}"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HVO_KEY_PER_FILE_DIRECTORY: /run/hvo-secrets
    volumes:
      - ${HVO_CONFIG_ROOT:?config root required}/initializer-secrets:/run/hvo-secrets:ro
      - ${HVO_CONFIG_ROOT}/certificates:/run/hvo-certificates:ro
      - ${HVO_CATALOG_ROOT:?catalog root required}:/app/catalog:ro
      - ${HVO_STATE_ROOT:?state root required}/data-protection:/app/DataProtection-Keys
      - type: bind
        source: ${HVO_OBJECT_STORE_ROOT:?object store root required}
        target: /var/lib/hvo/object-store
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    restart: "no"
    cpus: ${HVO_CPUS:-2}
    mem_limit: ${HVO_MEMORY:-2G}

  logichost:
    container_name: ${HVO_CONTAINER_NAME:?container name required}
    image: ${LOGICHOST_IMAGE:?digest reference required}
    user: "${HVO_RUNTIME_UID:?runtime uid required}:${HVO_RUNTIME_GID:?runtime gid required}"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      HVO_KEY_PER_FILE_DIRECTORY: /run/hvo-secrets
    ports:
      - ${HVO_PUBLIC_PORT:?public port required}:8080
    volumes:
      - ${HVO_CONFIG_ROOT:?config root required}/runtime-secrets:/run/hvo-secrets:ro
      - ${HVO_CONFIG_ROOT}/certificates:/run/hvo-certificates:ro
      - ${HVO_CATALOG_ROOT:?catalog root required}:/app/catalog:ro
      - ${HVO_STATE_ROOT:?state root required}/data-protection:/app/DataProtection-Keys
      - type: bind
        source: ${HVO_OBJECT_STORE_ROOT:?object store root required}
        target: /var/lib/hvo/object-store
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/alive"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    cpus: ${HVO_CPUS:-2}
    mem_limit: ${HVO_MEMORY:-2G}

networks:
  default:
    labels:
      io.hvoskymonitor.run-id: "${HVO_RUN_ID:?run id required}"
      io.hvoskymonitor.inventory-sha256: "${HVO_INVENTORY_SHA256:?inventory hash required}"

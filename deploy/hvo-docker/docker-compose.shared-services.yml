services:
  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: skymonitor-redis
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server --appendonly yes
        --user default off
        --user "$${REDIS_USER}" on ">$${REDIS_PASSWORD}" '~skymonitor:*' '+@all' '-@admin' '-@dangerous'
    environment:
      REDIS_USER: ${REDIS_USER:-skymonitor-app}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - skymonitor-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user \"$$REDIS_USER\" -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - skymonitor

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    container_name: skymonitor-mailpit
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${SMTP_WEB_PORT:-8025}:8025"
    restart: unless-stopped
    networks:
      - skymonitor

volumes:
  skymonitor-redis-data:
    name: skymonitor-redis-data

networks:
  skymonitor:
    name: skymonitor_default

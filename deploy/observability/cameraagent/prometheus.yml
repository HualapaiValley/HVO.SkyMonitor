global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s

rule_files:
  - cameraagent.rules.yml

scrape_configs:
  - job_name: cameraagent
    scheme: https
    metrics_path: /metrics
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /run/secrets/cameraagent-metrics-token
    sample_limit: 10000
    body_size_limit: 4MB
    static_configs:
      - targets: [cameraagent.example.invalid:443]

  # Optionally add a private cAdvisor target. Confirm the Docker container name
  # and exact metric availability on the qualification host before enrolling it.
  # - job_name: cameraagent-host
  #   sample_limit: 256
  #   body_size_limit: 4MB
  #   static_configs:
  #     - targets: [127.0.0.1:8080]
  #   metric_relabel_configs:

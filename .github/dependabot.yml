version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dotnet-servicing:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.Data.Sqlite"
        update-types:
          - "patch"
      aws-sdk:
        patterns:
          - "AWSSDK.*"
        update-types:
          - "patch"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      openiddict:
        patterns:
          - "OpenIddict*"
      skiasharp:
        patterns:
          - "SkiaSharp*"
      asp-versioning:
        patterns:
          - "Asp.Versioning*"
    labels:
      - "dependencies"
      - "nuget"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Digest-pinned base images (mcr.microsoft.com/dotnet/sdk and aspnet) of the CameraAgent and LogicHost
  # Dockerfiles (#1321). Both hosts must use the same images, so each image is bumped in both Dockerfiles in
  # one pull request (group-by: dependency-name), as RoofController does.
  - package-ecosystem: "docker"
    directories:
      - "/src/HVO.SkyMonitor.CameraAgent"
      - "/src/HVO.SkyMonitor.LogicHost"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dotnet-images:
        group-by: dependency-name
        patterns:
          - "*"
    ignore:
      # global.json pins the SDK exactly (rollForward: disable), so a new SDK tag is a coordinated manual
      # bump; Dependabot only refreshes the digest of the pinned SDK tag.
      - dependency-name: "dotnet/sdk"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # A new .NET major version is a target-framework migration, not a base-image refresh.
      - dependency-name: "dotnet/aspnet"
        update-types:
          - "version-update:semver-major"
    # No labels key: Dependabot applies its default "dependencies" and "docker" labels and creates "docker",
    # whereas a listed label that the repository lacks would be ignored.

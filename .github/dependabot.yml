version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dotnet-servicing:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.Data.Sqlite"
        update-types:
          - "patch"
      aws-sdk:
        patterns:
          - "AWSSDK.*"
        update-types:
          - "patch"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      openiddict:
        patterns:
          - "OpenIddict*"
      skiasharp:
        patterns:
          - "SkiaSharp*"
      asp-versioning:
        patterns:
          - "Asp.Versioning*"
    labels:
      - "dependencies"
      - "nuget"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

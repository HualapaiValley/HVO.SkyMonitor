name: Integration partition pilot (850)
on:
  push:
    branches: [feature/850-logichost-integration-critical-path]
permissions:
  contents: read
env:
  INTEGRATION_FILTER: TestCategory=Integration&TestCategory!=Soak&TestCategory!=Manual&TestCategory!=External&TestCategory!=Hardware
jobs:
  capacity:
    name: Runner capacity
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 5
    steps:
      - name: Inventory
        run: |
          echo "host=$(hostname) cpus=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')G disk=$(df -h / | awk 'NR==2{print $4}') free"
          docker info --format 'docker={{.ServerVersion}} cpus={{.NCPU}} mem={{.MemTotal}} running={{.ContainersRunning}}'
          uptime
  partitioned:
    name: Partitioned integration
    needs: capacity
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore and build Release
        run: |
          dotnet restore HVO.SkyMonitor.v9.slnx
          dotnet build HVO.SkyMonitor.v9.slnx --no-restore --configuration Release
      - name: Run LogicHost lane and the rest concurrently
        run: |
          mkdir -p TestResults/integration
          started=$(date +%s)
          ( s=$(date +%s)
            dotnet test tests/HVO.SkyMonitor.LogicHost.IntegrationTests/HVO.SkyMonitor.LogicHost.IntegrationTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/logichost --logger "trx;LogFileName=integration-logichost.trx" > TestResults/integration/lane-logichost.log 2>&1
            echo "lane-logichost exit=$? seconds=$(( $(date +%s) - s ))" ) &
          p1=$!
          ( s=$(date +%s)
            dotnet test tests/HVO.SkyMonitor.CameraAgent.Tests/HVO.SkyMonitor.CameraAgent.Tests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent-storage --logger "trx;LogFileName=integration-cameraagent-storage.trx"
            dotnet test tests/HVO.SkyMonitor.CameraAgent.AcceptanceTests/HVO.SkyMonitor.CameraAgent.AcceptanceTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent-standalone --logger "trx;LogFileName=integration-cameraagent-standalone.trx"
            dotnet test tests/HVO.SkyMonitor.Astronomy.Tests/HVO.SkyMonitor.Astronomy.Tests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/astronomy --logger "trx;LogFileName=integration-astronomy.trx"
            dotnet test tests/HVO.SkyMonitor.CameraAgent.IntegrationTests/HVO.SkyMonitor.CameraAgent.IntegrationTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent --logger "trx;LogFileName=integration-cameraagent.trx"
            dotnet test tests/HVO.SkyMonitor.CameraAgent.LogicHost.IntegrationTests/HVO.SkyMonitor.CameraAgent.LogicHost.IntegrationTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent-logichost --logger "trx;LogFileName=integration-cameraagent-logichost.trx"
            echo "lane-rest exit=$? seconds=$(( $(date +%s) - s ))" ) > TestResults/integration/lane-rest.log 2>&1 &
          p2=$!
          fail=0
          wait "$p1" || fail=1
          wait "$p2" || fail=1
          tail -1 TestResults/integration/lane-rest.log
          echo "wall=$(( $(date +%s) - started ))"
          grep -h "Passed!\|Failed!" TestResults/integration/lane-*.log
          exit "$fail"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-partition-pilot-${{ github.run_id }}
          path: TestResults/integration/
          retention-days: 3

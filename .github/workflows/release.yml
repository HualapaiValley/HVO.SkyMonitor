name: Release

# A final release, vX.Y.Z, or a release candidate, vX.Y.Z-rc.N, is cut from a commit on main (install contract section
# 3, #1310). Only the owner pushes v* tags; this workflow does the rest, and publishes only after the owner approves:
#
#   gate          admit the tag, read-only: annotated, names the product version (Directory.Build.props), on main, a
#                 final release's notes present, not yet released, and the production-release environment requires a
#                 reviewer (scripts/release:gate)
#   ci            the CI qualification of the tagged commit: the whole CI workflow, called (ci.yml, workflow_call)
#   build         build every release file from the qualified commit, read-only (scripts/release:assets)
#   draft         push the image by its version tag, attest the image and every file, and create a draft release
#   install-test  install and upgrade a throwaway instance from the draft's files, on linux-x64 and linux-arm64
#   publish       held until a required reviewer approves it in production-release; check the draft still holds the
#                 tested, attested files, then publish it, making it the latest release only when it is the newest
#                 final release (scripts/release:publish)
#   latest        when publishing made it the latest release, move the image's latest tag to its image
#                 (scripts/release:tag-latest)
#
# A release candidate is published as a GitHub pre-release and never moves latest; neither does a fix to an older
# version. Each tag's run is its own concurrency group, but publish and latest also share one release-wide group,
# release-promotion, so two releases never decide or move latest at once. Nothing here changes a repository or
# environment setting: the owner applies them (docs/runbooks/releases.md).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE_REPOSITORY: ghcr.io/hualapaivalley/skymonitor-cameraagent

jobs:
  gate:
    name: Release / Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      commit: ${{ steps.gate.outputs.commit }}
      created: ${{ steps.gate.outputs.created }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit only an annotated release tag for the product version on main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A step with no shell: is bash -e without pipefail, which would let tee hide the gate's failure.
          set -o pipefail
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]
          ./scripts/release:gate "$TAG" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  # The qualification main's pushes run, for the tagged commit, before anything is built from it.
  ci:
    name: Release / CI
    needs: gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Release / Build
    needs: [gate, ci]
    runs-on: ubuntu-24.04
    # The arm64 image is built under emulation; its publish alone has taken 46 minutes (#1410).
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - name: Set up QEMU for the arm64 image
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # Pinned as prerelease.yml pins them, so an image build does not change with the runner's toolchain.
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.26.1@sha256:8290a3b1183f45fb0c7ccd2faa7aa88eeb9af0ea85ff54458cbd8cbdb576e721
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the release's files
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          CREATED: ${{ needs.gate.outputs.created }}
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          ./scripts/release:assets \
            --version "$VERSION" --commit "$COMMIT" --created "$CREATED" --builder "$BUILDER" \
            --image-repository "$IMAGE_REPOSITORY" --install-script src/HVO.SkyMonitor.Deployment.Cli/install.sh \
            --output "$RUNNER_TEMP/release" --image-oci "$RUNNER_TEMP/image/skymonitor-cameraagent.oci.tar"
      # Artifacts are named by run, not attempt, so re-running a failed install test or publish finds them; a full
      # re-run replaces them, and then stops at the draft job while the earlier attempt's draft exists.
      - name: Upload the release's files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files-${{ github.run_id }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload the image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-image-${{ github.run_id }}
          path: ${{ runner.temp }}/image/skymonitor-cameraagent.oci.tar
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  draft:
    name: Release / Draft
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The job that pushes, attests and creates the draft. It builds nothing: it runs the tagged commit's own scripts on
    # the files the build job wrote. It pushes the image under its version tag alone; latest moves only after publishing.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - name: Download the release's files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files-${{ github.run_id }}
          path: ${{ runner.temp }}/release
      - name: Download the image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-image-${{ github.run_id }}
          path: ${{ runner.temp }}/image
      - name: Check the files name the tagged release
        id: files
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          CREATED: ${{ needs.gate.outputs.created }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check --strict SHA256SUMS
          # Every file is listed in SHA256SUMS, and nothing else is here.
          [[ "$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" == "$( (cut -c 67- SHA256SUMS; printf 'SHA256SUMS\n') | sort)" ]]
          # A final release's release.json carries its upgrade notes; a release candidate's is marked a pre-release.
          jq -e --arg version "$VERSION" --arg tag "$TAG" --arg commit "$COMMIT" --arg created "$CREATED" \
            --argjson prerelease "$PRERELEASE" --arg repository "$IMAGE_REPOSITORY" '
            .version == $version and .tag == $tag and .commit == $commit and .created == $created
            and .prerelease == $prerelease
            and ($prerelease or any(.upgradeNotes[]; .version == $version))
            and .images.cameraAgent.repository == $repository
            and .images.cameraAgent.tag == $version
          ' release.json >/dev/null
          digest="$(jq -er '.images.cameraAgent.digest' release.json)"
          [[ "$(tar -xOf "$RUNNER_TEMP/image/skymonitor-cameraagent.oci.tar" index.json | jq -r '.manifests[0].digest')" == "$digest" ]]
          # Each platform image is labelled with the release's version, commit and created time, and with the state
          # contract release.json gives.
          "$GITHUB_WORKSPACE/scripts/release:check-image-labels" "$RUNNER_TEMP/image/skymonitor-cameraagent.oci.tar" release.json
          # A release is never replaced; this token also lists drafts, which the gate's could not. Every page is read
          # strictly: a read that fails or is malformed fails the job, and never counts as there being no release.
          "$GITHUB_WORKSPACE/scripts/release:prerelease-check" unreleased "$TAG"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Sign in to the image registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the image under its version tag
        id: push
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          DIGEST: ${{ steps.files.outputs.digest }}
        run: |
          pushed="$(./scripts/release:push-image "$RUNNER_TEMP/image/skymonitor-cameraagent.oci.tar" "$IMAGE_REPOSITORY:$VERSION")"
          [[ "$pushed" == "$DIGEST" ]]
          printf 'digest=%s\n' "$pushed" >> "$GITHUB_OUTPUT"
      - name: Attest the image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest every file's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Verify the image's attestation from the registry
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE_REPOSITORY@$DIGEST" --bundle-from-oci --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --source-ref "$GITHUB_REF" --source-digest "$COMMIT" --deny-self-hosted-runners >/dev/null
      - name: Sign out of the image registry
        if: always()
        run: docker logout ghcr.io
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          {
            if [[ "$PRERELEASE" == true ]]; then
              echo "Release candidate $VERSION, from \`$COMMIT\` on main. It is published as a pre-release and never becomes the latest release."
            else
              echo "SkyMonitor $VERSION, from \`$COMMIT\` on main."
            fi
            echo
            ./scripts/release:notes --body "$VERSION"
            cat <<NOTES
          ## Checking the files

          CameraAgent image: \`$IMAGE_REPOSITORY:$VERSION@$DIGEST\`

          Check the files with \`sha256sum --check SHA256SUMS\` and their build provenance with
          \`gh attestation verify <file> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml\`,
          then install or upgrade with \`install.sh\` or \`--release <folder>\`: see docs/runbooks/releases.md.
          NOTES
          } > "$notes"
          prerelease=()
          [[ "$PRERELEASE" != true ]] || prerelease=(--prerelease)
          gh release create "$TAG" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${prerelease[@]}" --latest=false \
            --title "SkyMonitor $VERSION" --notes-file "$notes"
      - name: Read the draft's files back
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/draft"
          diff -r "$RUNNER_TEMP/release" "$RUNNER_TEMP/draft"
      # The install tests run the draft's own bytes, read back above with this job's token, so the self-hosted runner
      # never holds a token that can write.
      - name: Upload the draft's files for the install tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-draft-${{ github.run_id }}
          path: ${{ runner.temp }}/draft/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  install-test:
    name: Release / Install and Upgrade (${{ matrix.platform }})
    needs: [gate, draft]
    # Tag pushes alone; the arm64 runner never runs a pull request's code.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: '"ubuntu-24.04"'
          - platform: linux-arm64
            runner: '["self-hosted", "linux", "ARM64", "hvo-skymonitor-arm64"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - name: Download the draft's files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-draft-${{ github.run_id }}
          path: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install from the offline archive, then upgrade by digest from the registry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # The registry login lives in this run's own Docker configuration, not the runner's, and goes with it.
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ./scripts/test:release-install --release "$RELEASE" --upgrade-source registry
      - name: Remove the draft's files
        if: always()
        env:
          RELEASE: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf "$RELEASE" "$RUNNER_TEMP/docker-config-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  publish:
    name: Release / Publish
    needs: [gate, draft, install-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # GitHub holds this job until a required reviewer of production-release approves it. The first step checks the
    # environment still requires one, so an environment without the rule never lets the job publish unapproved.
    environment: production-release
    # Promotion is serialized across every release: every run's latest job shares this group. A running job is never
    # cancelled, but GitHub keeps only one job waiting: one queued behind it cancels it before it writes anything, and
    # that run is re-run (docs/runbooks/releases.md). Inside the group, release:publish reads again before it writes.
    concurrency:
      group: release-promotion
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: read
    outputs:
      moved: ${{ steps.publish.outputs.moved }}
    steps:
      # The tagged commit's scripts make every check below and the publish itself.
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - name: Require the owner's approval rule
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release:check-environment production-release
      - name: Download the tested files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-draft-${{ github.run_id }}
          path: ${{ runner.temp }}/tested
      - name: Check the draft still holds the tested, attested files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          DIGEST: ${{ needs.draft.outputs.digest }}
        run: |
          # Drafts are not served by releases/tags/<tag>, so the whole list is read strictly: exactly one release has
          # the tag, and it is still the draft its tag calls for.
          ./scripts/release:prerelease-check draft "$TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/draft"
          diff -r "$RUNNER_TEMP/tested" "$RUNNER_TEMP/draft"
          cd "$RUNNER_TEMP/draft"
          sha256sum --check --strict SHA256SUMS
          # Each file's provenance names this workflow at this tag and commit, built on a GitHub-hosted runner.
          for file in *; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              --source-ref "$GITHUB_REF" --source-digest "$COMMIT" --deny-self-hosted-runners >/dev/null
          done
          # The draft job verified the image's attestation from the registry; it is still on record for the digest.
          "$GITHUB_WORKSPACE/scripts/release:prerelease-check" attested "$DIGEST"
      - name: Publish, moving latest only for the newest final release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -o pipefail
          ./scripts/release:publish "$TAG" | tee -a "$GITHUB_OUTPUT"

  latest:
    name: Release / Latest Image
    needs: [gate, draft, publish]
    # Only after publishing made this release the latest release. Re-running this job alone moves latest again.
    if: needs.publish.outputs.moved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The publish job's group: another release is published or tagged latest before or after this, never meanwhile.
    concurrency:
      group: release-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - name: Sign in to the image registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Move the image's latest tag to the release's image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          DIGEST: ${{ needs.draft.outputs.digest }}
        run: ./scripts/release:tag-latest "$IMAGE_REPOSITORY" "$TAG" "$DIGEST"
      - name: Sign out of the image registry
        if: always()
        run: docker logout ghcr.io

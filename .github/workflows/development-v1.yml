name: Development v1

on:
  pull_request:
    branches: [development/v1]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [development/v1]
  # The merge queue tests each queued PR on a temporary merge_group commit built
  # on the latest base; both required checks must report there too.
  merge_group:
    types: [checks_requested]
    branches: [development/v1]

permissions:
  contents: read

concurrency:
  group: development-v1-${{ github.event_name }}-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  preflight:
    name: Development v1 / Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    outputs:
      merge_group_run_id: ${{ steps.merge-group.outputs.run_id }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == '0000000000000000000000000000000000000000' ]]; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Validate changelog fragments
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(--check)
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            parents="$(git rev-list --parents -n 1 HEAD)" || parents=''
            read -r merge first second extra <<< "$parents"
            if [[ "$merge" == "$GITHUB_SHA" && -n "$first" && -n "$second" && "$second" == "$PR_HEAD_SHA" && -z "$extra" ]]; then
              args+=(--base "$first")
            else
              echo 'Cannot bind the changelog fragment limit to the checked-out PR merge parents.' >&2
              exit 1
            fi
          fi
          ./scripts/release:changelog "${args[@]}"
          ./scripts/test:changelog

      - name: Lint workflows
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          find .github/workflows -type f \( -iname '*.yml' -o -iname '*.yaml' \) -print0 > "$RUNNER_TEMP/actionlint-workflows.list"
          mapfile -d '' -t workflows < "$RUNNER_TEMP/actionlint-workflows.list"
          ((${#workflows[@]} > 0)) || { echo 'No workflow files found for actionlint.' >&2; exit 1; }
          "$RUNNER_TEMP/actionlint" "${workflows[@]}"

      - name: Install pinned workflow YAML parser
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps \
            --target "$RUNNER_TEMP/hvo-pyyaml" -r scripts/ci/pyyaml-requirements.txt
          printf 'PYTHONPATH=%s\n' "$RUNNER_TEMP/hvo-pyyaml" >> "$GITHUB_ENV"

      # Offline and cheap enough to run on every draft/push (#1345).
      - name: Check Dockerfile base images
        run: ./scripts/ci:base-images

      - name: Check managed and native SkiaSharp alignment
        run: ./scripts/test:skiasharp-pins

      - name: Check CI control contracts
        run: |
          ./scripts/ci:shell-syntax
          ./scripts/test:ci-classification
          ./scripts/test:coordination-guard
          ./scripts/test:pr-review-tools
          ./scripts/test:development-v1-ci

      - name: Check coverage policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/coverage:policy "$EVENT_NAME" "$BASE_REF"

      # tests/cli/ansi-to-svg.py, which draws the terminal programs' screens, and scripts/docs:terminal-screenshots, which
      # replaces docs/images/terminal with them (#1317).
      - name: Test the terminal screenshot converter and script
        run: python3 -m unittest discover -s tests/cli -p 'test_*.py' -v

      # The full-history checkout above is what the scan reads (#1321).
      - name: Scan history for secrets
        env:
          HVO_GITLEAKS_CACHE_DIR: ${{ runner.temp }}/gitleaks
        run: |
          ./scripts/ci:secret-scan

      - name: Classify secret scanner contract inputs
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: GITHUB_STEP_SUMMARY='' ./scripts/ci:classify "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # Only a successful, explicit false may skip the contract. Missing outputs
      # or classifier failures still run it, and a failed classifier stays red.
      - name: Test secret scanner contract
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.secret_scan_contract != 'false') }}
        env:
          HVO_GITLEAKS_CACHE_DIR: ${{ runner.temp }}/gitleaks
        run: |
          ./scripts/test:ci-secret-scan

      # The same classification selects the pre-release scripts' tests: their
      # scripts, the pre-release workflow, the release tool or this wiring. As
      # above, only a successful, explicit false skips them.
      - name: Test release scripts
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.release_scripts != 'false') }}
        run: |
          ./scripts/test:release-scripts

      - name: Find successful merge-group validation for the pushed SHA
        id: merge-group
        if: github.event_name == 'push' && github.ref == 'refs/heads/development/v1' && github.actor == 'github-merge-queue[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if run_id="$(./scripts/ci:merge-group-success "$GITHUB_REPOSITORY" "$GITHUB_SHA")" && [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          else
            printf 'No verified merge-group run for %s. Running full Build and Unit.\n' "$GITHUB_SHA"
          fi

  build-unit:
    name: Development v1 / Build and Unit
    needs: preflight
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(needs.preflight.outputs.merge_group_run_id != '' && '["ubuntu-24.04"]' || '["self-hosted", "linux", "x64", "hvo-skymonitor-build"]') }}
    timeout-minutes: 22
    env:
      MERGE_GROUP_RUN_ID: ${{ needs.preflight.outputs.merge_group_run_id }}
    steps:
      - name: Record workload start
        run: |
          started_at_epoch="$(date +%s)"
          evidence_root="$RUNNER_TEMP/development-v1"
          rm -rf "$evidence_root"
          mkdir -p "$evidence_root/timing" "$evidence_root/unit"
          {
            printf 'DEV_V1_EVIDENCE_ROOT=%s\n' "$evidence_root"
            printf 'DEV_V1_STARTED_AT_EPOCH=%s\n' "$started_at_epoch"
            printf 'DEV_V1_DEADLINE_EPOCH=%s\n' "$((started_at_epoch + 1080))"
          } >> "$GITHUB_ENV"

      - name: Checkout exact commit
        if: env.MERGE_GROUP_RUN_ID == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Select Build and Unit workload
        id: workload
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          evidence="$DEV_V1_EVIDENCE_ROOT/classification.md"
          classifier="$DEV_V1_EVIDENCE_ROOT/base-classifier"
          output="$DEV_V1_EVIDENCE_ROOT/classifier-output.txt"
          component_output="$DEV_V1_EVIDENCE_ROOT/component-classifier-output.txt"
          run_full=true
          reason='non-pull-request event requires full validation'
          run_deployment_cli=true
          deployment_cli_reason='non-pull-request event requires Deployment.Cli.Tests'
          base=''
          merge="$GITHUB_SHA"
          printf 'Preflight dependency: success\n' > "$evidence"
          : > "$output"
          : > "$component_output"
          if [[ -n "${MERGE_GROUP_RUN_ID:-}" ]]; then
            run_full=false
            reason='exact push SHA already passed merge-group validation'
            run_deployment_cli=false
            deployment_cli_reason='exact push SHA already passed merge-group validation'
            printf 'mergeGroupRunId=%s\n' "$MERGE_GROUP_RUN_ID" >> "$evidence"
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            reason='merge binding unavailable or mismatched'
            deployment_cli_reason='merge binding unavailable or mismatched'
            parents="$(git rev-list --parents -n 1 HEAD)" || parents=''
            read -r merge_commit base second extra <<< "$parents"
            if [[ "$merge_commit" == "$GITHUB_SHA" && -n "$base" && -n "$PR_HEAD_SHA" && -n "$second" && "$second" == "$PR_HEAD_SHA" && -z "$extra" ]]; then
              reason='base classifier unavailable or failed'
              deployment_cli_reason='base classifier unavailable or failed'
              if git show "$base:scripts/ci:classify" > "$classifier"; then
                eligible=true
                decision=''
                for endpoint in "$PR_HEAD_SHA" "$merge_commit"; do
                  reason='base classifier unavailable or failed'
                  printf '\nClassification endpoint: %s\n' "$endpoint" >> "$evidence"
                  if GITHUB_STEP_SUMMARY="$evidence" bash "$classifier" pull_request "$base" "$endpoint" docs-fast-only > "$output"; then
                    reason='classifier output missing or invalid'
                    mapfile -t decisions < <(grep '^docs_fast_path=' "$output" || true)
                    mapfile -t reasons < <(grep '^docs_fast_path_reason=' "$output" || true)
                    if [[ ${#decisions[@]} -eq 1 && ${#reasons[@]} -eq 1 && "${reasons[0]}" =~ ^docs_fast_path_reason=[a-zA-Z0-9\ .,/-]+$ ]]; then
                      case "${decisions[0]}" in
                        docs_fast_path=true|docs_fast_path=verify-restore)
                          if [[ -z "$decision" || "$decision" == "${decisions[0]}" ]]; then
                            decision="${decisions[0]}"
                            reason="${reasons[0]#*=}"
                            continue
                          fi
                          reason='classification endpoints disagree'
                          ;;
                        docs_fast_path=false) reason="${reasons[0]#*=}" ;;
                      esac
                    fi
                  fi
                  eligible=false
                  break
                done
                if [[ "$eligible" == true ]]; then
                  if [[ "$decision" == docs_fast_path=true ]]; then
                    run_full=false
                  elif [[ "$decision" == docs_fast_path=verify-restore ]]; then
                    reason='reviewed restore import proof failed or was unavailable'
                    proof="$DEV_V1_EVIDENCE_ROOT/restore-import-proof.txt"
                    proof_start="$SECONDS"
                    proof_exit=not-run
                    if proof_scratch="$(mktemp -d "$RUNNER_TEMP/hvo-restore-proof.XXXXXXXX")"; then
                      TMPDIR="$proof_scratch" timeout --signal=TERM --kill-after=5s 30s bash "$classifier" --verify-docs-restore "$base" > "$proof" 2>> "$evidence" &
                      proof_group=$!
                      proof_exit=0
                      wait "$proof_group" || proof_exit=$?
                      # GNU timeout leads its own group. The monitored shell can exit before its descendants.
                      kill -KILL -- "-$proof_group" 2>/dev/null || true
                      rm -rf -- "$proof_scratch" || true
                      if [[ "$proof_exit" == 0 ]] && printf 'restore_imports_verified=true\n' | cmp -s - "$proof"; then
                        run_full=false
                        reason='safe documentation and reviewed restore imports verified'
                      fi
                    fi
                    proof_elapsed="$((SECONDS - proof_start))"
                    printf 'restoreProofExitCode=%s\nrestoreProofElapsedSeconds=%s\n' "$proof_exit" "$proof_elapsed" >> "$evidence"
                    if [[ "$run_full" == true ]]; then
                      # The optional proof shares the hard job timeout. Refund its elapsed time to the full workload.
                      printf 'DEV_V1_DEADLINE_EPOCH=%s\n' "$((DEV_V1_DEADLINE_EPOCH + proof_elapsed))" >> "$GITHUB_ENV"
                    fi
                  fi
                fi
                if [[ "$run_full" == false ]]; then
                  run_deployment_cli=false
                  deployment_cli_reason='documentation fast path skips Unit workload'
                else
                  deploy_cli_skip_eligible=true
                  deployment_cli_reason='pull request touches no deployment, delivery, shared, or complete-matrix paths'
                  for endpoint in "$PR_HEAD_SHA" "$merge_commit"; do
                    printf '\nComponent classification endpoint: %s\n' "$endpoint" >> "$evidence"
                    if ! GITHUB_STEP_SUMMARY="$evidence" bash "$classifier" pull_request "$base" "$endpoint" > "$component_output"; then
                      deploy_cli_skip_eligible=false
                      deployment_cli_reason='base classifier unavailable or failed'
                      break
                    fi
                    mapfile -t complete_vals < <(grep '^complete=' "$component_output" || true)
                    mapfile -t delivery_vals < <(grep '^delivery=' "$component_output" || true)
                    mapfile -t deployment_vals < <(grep '^deployment=' "$component_output" || true)
                    if [[ ${#complete_vals[@]} -ne 1 || ${#delivery_vals[@]} -ne 1 || ${#deployment_vals[@]} -ne 1 ]]; then
                      deploy_cli_skip_eligible=false
                      deployment_cli_reason='component classifier output missing or invalid'
                      break
                    fi
                    complete_val="${complete_vals[0]}"
                    delivery_val="${delivery_vals[0]}"
                    deployment_val="${deployment_vals[0]}"
                    if [[ ( "$complete_val" != complete=true && "$complete_val" != complete=false ) ||
                          ( "$delivery_val" != delivery=true && "$delivery_val" != delivery=false ) ||
                          ( "$deployment_val" != deployment=true && "$deployment_val" != deployment=false ) ]]; then
                      deploy_cli_skip_eligible=false
                      deployment_cli_reason='component classifier output missing or invalid'
                      break
                    fi
                    if [[ "$complete_val" != complete=false || "$delivery_val" != delivery=false || "$deployment_val" != deployment=false ]]; then
                      deploy_cli_skip_eligible=false
                      deployment_cli_reason="selected by ${complete_val}, ${delivery_val}, ${deployment_val}"
                      break
                    fi
                  done
                  if [[ "$deploy_cli_skip_eligible" == true ]]; then
                    run_deployment_cli=false
                  fi
                fi
              fi
            fi
          fi
          printf 'mergeSha=%s\nbaseSha=%s\nprHeadSha=%s\nrunFull=%s\nreason=%s\nrunDeploymentCli=%s\ndeploymentCliReason=%s\n' \
            "$merge" "$base" "$PR_HEAD_SHA" "$run_full" "$reason" "$run_deployment_cli" "$deployment_cli_reason" >> "$evidence"
          printf 'run_full=%s\nreason=%s\nbase_sha=%s\nrun_deployment_cli=%s\ndeployment_cli_reason=%s\n' \
            "$run_full" "$reason" "$base" "$run_deployment_cli" "$deployment_cli_reason" >> "$GITHUB_OUTPUT"
          cat "$evidence"

      - name: Setup .NET from global.json
        if: ${{ steps.workload.outcome != 'success' || steps.workload.outputs.run_full != 'false' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore solution
        if: ${{ steps.workload.outcome != 'success' || steps.workload.outputs.run_full != 'false' }}
        id: restore
        run: |
          remaining="$((DEV_V1_DEADLINE_EPOCH - $(date +%s)))"
          ((remaining > 0)) || exit 124
          /usr/bin/time -v -o "$DEV_V1_EVIDENCE_ROOT/timing/restore.time" \
            timeout --signal=TERM --kill-after=30s "${remaining}s" \
            dotnet restore HVO.SkyMonitor.v9.slnx

      - name: Build warning-clean Release solution
        if: ${{ steps.workload.outcome != 'success' || steps.workload.outputs.run_full != 'false' }}
        id: build
        run: |
          remaining="$((DEV_V1_DEADLINE_EPOCH - $(date +%s)))"
          ((remaining > 0)) || exit 124
          /usr/bin/time -v -o "$DEV_V1_EVIDENCE_ROOT/timing/build.time" \
            timeout --signal=TERM --kill-after=30s "${remaining}s" \
            dotnet build HVO.SkyMonitor.v9.slnx \
              --no-restore \
              --configuration Release \
              -warnaserror

      # Whole-repository ShellCheck and exhaustive category discovery are owned by
      # ci.yml's Quality and Build jobs on the main/release qualification path (#1142).
      # The terminal programs' render tests save each screen to HVO_TERMINAL_RENDERS_DIR (#1317), inside the evidence.
      - name: Run Docker-disabled Unit selection
        if: ${{ steps.workload.outcome != 'success' || steps.workload.outputs.run_full != 'false' }}
        id: unit
        env:
          DOCKER_HOST: unix:///tmp/hvo-no-docker.sock
          HVO_TERMINAL_RENDERS_DIR: ${{ runner.temp }}/development-v1/terminal-renders
          WORKLOAD_OUTCOME: ${{ steps.workload.outcome }}
          RUN_DEPLOYMENT_CLI: ${{ steps.workload.outputs.run_deployment_cli }}
        run: |
          coverage_args=()
          unit_filter="TestCategory=Unit&TestCategory!=Performance&FullyQualifiedName!~HVO.SkyMonitor.LogicHost&FullyQualifiedName!~HVO.SkyMonitor.CameraAgent.LogicHost"
          test_project_args=(-p:SkipLogicHostTests=true)
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$WORKLOAD_OUTCOME" == success && "$RUN_DEPLOYMENT_CLI" == false ]]; then
            coverage_args+=(--skip-deployment-cli)
            unit_filter+="&FullyQualifiedName!~HVO.SkyMonitor.Deployment.Cli.Tests"
            test_project_args+=(-p:SkipDeploymentCliTests=true)
          fi
          ./scripts/coverage:development-v1 --settings "${coverage_args[@]}" "$DEV_V1_EVIDENCE_ROOT/coverage.runsettings"
          remaining="$((DEV_V1_DEADLINE_EPOCH - $(date +%s)))"
          ((remaining > 0)) || exit 124
          /usr/bin/time -v -o "$DEV_V1_EVIDENCE_ROOT/timing/unit.time" \
            timeout --signal=TERM --kill-after=30s "${remaining}s" \
            dotnet test HVO.SkyMonitor.v9.slnx \
              --no-build \
              --configuration Release \
              --filter "$unit_filter" \
              "${test_project_args[@]}" \
              --settings "$DEV_V1_EVIDENCE_ROOT/coverage.runsettings" \
              --collect:"XPlat Code Coverage" \
              --results-directory "$DEV_V1_EVIDENCE_ROOT/unit" \
              --logger trx

      - name: Enforce canonical per-file coverage floors
        if: ${{ steps.workload.outcome != 'success' || steps.workload.outputs.run_full != 'false' }}
        id: coverage
        env:
          WORKLOAD_OUTCOME: ${{ steps.workload.outcome }}
          RUN_DEPLOYMENT_CLI: ${{ steps.workload.outputs.run_deployment_cli }}
        run: |
          remaining="$((DEV_V1_DEADLINE_EPOCH - $(date +%s)))"
          ((remaining > 0)) || exit 124
          # The timed child expands the exported evidence directory.
          # shellcheck disable=SC2016
          /usr/bin/time -v -o "$DEV_V1_EVIDENCE_ROOT/timing/coverage.time" \
            timeout --signal=TERM --kill-after=30s "${remaining}s" \
            bash -euo pipefail -c '
              coverage_args=()
              if [[ "$GITHUB_EVENT_NAME" == pull_request && "$WORKLOAD_OUTCOME" == success && "$RUN_DEPLOYMENT_CLI" == false ]]; then
                coverage_args+=(--skip-deployment-cli)
              fi
              dotnet tool restore
              ./scripts/test:coverage-development-v1
              ./scripts/coverage:development-v1 "${coverage_args[@]}" "$DEV_V1_EVIDENCE_ROOT/unit" "$DEV_V1_EVIDENCE_ROOT/coverage"
            '

      # Those screens drawn as SVG, as docs/images/terminal has them, and kept with the evidence below (#1317).
      - name: Draw terminal screenshots
        if: ${{ !cancelled() && (steps.workload.outcome != 'success' || steps.workload.outputs.run_full != 'false') }}
        run: |
          mkdir -p "$DEV_V1_EVIDENCE_ROOT/terminal-renders"
          ./scripts/docs:terminal-screenshots --draw "$DEV_V1_EVIDENCE_ROOT/terminal-renders"

      - name: Write evidence summary
        if: always()
        env:
          CLASSIFY_OUTCOME: ${{ steps.workload.outcome }}
          RUN_FULL: ${{ steps.workload.outputs.run_full }}
          WORKLOAD_REASON: ${{ steps.workload.outputs.reason }}
          RUN_DEPLOYMENT_CLI: ${{ steps.workload.outputs.run_deployment_cli }}
          DEPLOYMENT_CLI_REASON: ${{ steps.workload.outputs.deployment_cli_reason }}
          CLASSIFIED_BASE: ${{ steps.workload.outputs.base_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          read_metric() {
            local file="$1" label="$2"
            [[ -f "$file" ]] || return 0
            awk -v label="$label" 'index($0, label) { sub(/^.*: /, ""); print; exit }' "$file"
          }
          stage_json() {
            local stage="$1" outcome="$2" file="$DEV_V1_EVIDENCE_ROOT/timing/$1.time"
            jq -n \
              --arg name "$stage" \
              --arg outcome "$outcome" \
              --arg elapsed "$(read_metric "$file" 'Elapsed (wall clock) time')" \
              --arg rss "$(read_metric "$file" 'Maximum resident set size (kbytes)')" \
              '{name:$name,outcome:$outcome,elapsed:$elapsed,largestProcessRssKilobytes:($rss|if length==0 then null else tonumber end)}'
          }
          docs_fast_path=false
          reason="${WORKLOAD_REASON:-classification unavailable; full validation required}"
          deployment_cli_included=true
          deployment_cli_reason="${DEPLOYMENT_CLI_REASON:-classification unavailable; Deployment.Cli.Tests required}"
          sdk_version=''
          merge_group_run_url=''
          if [[ "$CLASSIFY_OUTCOME" == success && "$RUN_FULL" == false ]]; then
            deployment_cli_included=false
            if [[ -n "${MERGE_GROUP_RUN_ID:-}" ]]; then
              merge_group_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$MERGE_GROUP_RUN_ID"
              printf 'Build and Unit reused [merge-group validation for %s](%s).\n' "$GITHUB_SHA" "$merge_group_run_url" >> "$GITHUB_STEP_SUMMARY"
            else
              docs_fast_path=true
            fi
          else
            if [[ "$GITHUB_EVENT_NAME" == pull_request && "$CLASSIFY_OUTCOME" == success && "$RUN_DEPLOYMENT_CLI" == false ]]; then
              deployment_cli_included=false
            fi
            sdk_version="$(dotnet --version 2>/dev/null || true)"
          fi
          completed_at="$(date +%s)"
          trx_count="$(find "$DEV_V1_EVIDENCE_ROOT/unit" -name '*.trx' -type f | wc -l)"
          jq -n \
            --arg schema hvo-development-v1-ci-v6 \
            --arg headSha "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --argjson docsFastPath "$docs_fast_path" \
            --arg docsFastPathReason "$reason" \
            --argjson deploymentCliTestsIncluded "$deployment_cli_included" \
            --arg deploymentCliTestsReason "$deployment_cli_reason" \
            --arg mergeGroupRunUrl "$merge_group_run_url" \
            --arg baseSha "$CLASSIFIED_BASE" \
            --arg prHeadSha "$PR_HEAD_SHA" \
            --arg sdkVersion "$sdk_version" \
            --argjson elapsed "$((completed_at - DEV_V1_STARTED_AT_EPOCH))" \
            --argjson trxCount "$trx_count" \
            --argjson restore "$(stage_json restore "$RESTORE_OUTCOME")" \
            --argjson build "$(stage_json build "$BUILD_OUTCOME")" \
            --argjson unit "$(stage_json unit "$UNIT_OUTCOME")" \
            --argjson coverage "$(stage_json coverage "$COVERAGE_OUTCOME")" \
            '{schema:$schema,profile:"development-v1",headSha:$headSha,event:$event,baseSha:$baseSha,prHeadSha:$prHeadSha,mergeSha:$headSha,docsFastPath:$docsFastPath,docsFastPathReason:$docsFastPathReason,deploymentCliTestsIncluded:$deploymentCliTestsIncluded,deploymentCliTestsReason:$deploymentCliTestsReason,preflight:"success",sdkVersion:($sdkVersion|if length==0 then null else . end),runnerElapsedThroughSummaryStartSeconds:$elapsed,targetSeconds:600,workloadBudgetSeconds:1080,hardTimeoutSeconds:1320,unitTrxCount:$trxCount,memoryMetric:"GNU time ru_maxrss: largest single process",stages:[$restore,$build,$unit,$coverage],qualificationWorkflow:"ci.yml",qualificationOnlyChecks:["whole-repository-shellcheck","exhaustive-test-category-discovery"],mergeGroupRunUrl:($mergeGroupRunUrl|if length==0 then null else . end)}' \
            > "$DEV_V1_EVIDENCE_ROOT/manifest.json"
          jq . "$DEV_V1_EVIDENCE_ROOT/manifest.json"

      - name: Upload development CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: development-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/development-v1/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

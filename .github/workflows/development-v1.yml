name: Development v1

on:
  pull_request:
    branches: [development/v1]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [development/v1]
  # The merge queue tests each queued PR on a temporary merge_group commit built
  # on the latest base; both required checks must report there too.
  merge_group:
    types: [checks_requested]
    branches: [development/v1]

permissions:
  contents: read

concurrency:
  group: development-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  preflight:
    name: Development v1 / Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 4 || 6 }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == '0000000000000000000000000000000000000000' ]]; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Lint workflows
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          find .github/workflows -type f \( -iname '*.yml' -o -iname '*.yaml' \) -print0 > "$RUNNER_TEMP/actionlint-workflows.list"
          mapfile -d '' -t workflows < "$RUNNER_TEMP/actionlint-workflows.list"
          ((${#workflows[@]} > 0)) || { echo 'No workflow files found for actionlint.' >&2; exit 1; }
          "$RUNNER_TEMP/actionlint" "${workflows[@]}"

      - name: Install pinned workflow YAML parser
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps \
            --target "$RUNNER_TEMP/hvo-pyyaml" -r scripts/ci/pyyaml-requirements.txt
          printf 'PYTHONPATH=%s\n' "$RUNNER_TEMP/hvo-pyyaml" >> "$GITHUB_ENV"

      # Offline and cheap enough to run on every draft/push (#1345).
      - name: Check Dockerfile base images
        run: ./scripts/ci:base-images

      - name: Check managed and native SkiaSharp alignment
        run: ./scripts/test:skiasharp-pins

      - name: Check CI control contracts
        run: |
          ./scripts/ci:shell-syntax
          ./scripts/test:ci-classification
          ./scripts/test:coordination-guard
          ./scripts/test:pr-review-tools
          ./scripts/test:development-v1-ci

      - name: Check coverage policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/coverage:policy "$EVENT_NAME" "$BASE_REF"

      # tests/cli/ansi-to-svg.py, which draws the terminal programs' screens, and scripts/docs:terminal-screenshots, which
      # replaces docs/images/terminal with them (#1317).
      - name: Test the terminal screenshot converter and script
        run: python3 -m unittest discover -s tests/cli -p 'test_*.py' -v

      # The full-history checkout above is what the scan reads (#1321).
      - name: Scan history for secrets
        env:
          HVO_GITLEAKS_CACHE_DIR: ${{ runner.temp }}/gitleaks
        run: |
          ./scripts/ci:secret-scan

      - name: Classify secret scanner contract inputs
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: GITHUB_STEP_SUMMARY='' ./scripts/ci:classify "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # Only a successful, explicit false may skip the contract. Missing outputs
      # or classifier failures still run it, and a failed classifier stays red.
      - name: Test secret scanner contract
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.secret_scan_contract != 'false') }}
        env:
          HVO_GITLEAKS_CACHE_DIR: ${{ runner.temp }}/gitleaks
        run: |
          ./scripts/test:ci-secret-scan

      # The same classification selects the pre-release scripts' tests: their
      # scripts, the pre-release workflow, the release tool or this wiring. As
      # above, only a successful, explicit false skips them.
      - name: Test release scripts
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.release_scripts != 'false') }}
        run: |
          ./scripts/test:release-scripts

  build-unit:
    name: Development v1 / Build and Unit
    needs: preflight
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.draft == false
    runs-on: [self-hosted, linux, x64, hvo-skymonitor-build]
    timeout-minutes: 22
    steps:
      - name: Record workload start
        run: |
          started_at_epoch="$(date +%s)"
          evidence_root="$RUNNER_TEMP/development-v1"
          rm -rf "$evidence_root"
          mkdir -p "$evidence_root/timing" "$evidence_root/unit"
          {
            printf 'DEV_V1_EVIDENCE_ROOT=%s\n' "$evidence_root"
            printf 'DEV_V1_STARTED_AT_EPOCH=%s\n' "$started_at_epoch"
            printf 'DEV_V1_DEADLINE_EPOCH=%s\n' "$((started_at_epoch + 1080))"
          } >> "$GITHUB_ENV"

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore solution
        id: restore
        run: |
          remaining="$((DEV_V1_DEADLINE_EPOCH - $(date +%s)))"
          ((remaining > 0)) || exit 124
          /usr/bin/time -v -o "$DEV_V1_EVIDENCE_ROOT/timing/restore.time" \
            timeout --signal=TERM --kill-after=30s "${remaining}s" \
            dotnet restore HVO.SkyMonitor.v9.slnx

      - name: Build warning-clean Release solution
        id: build
        run: |
          remaining="$((DEV_V1_DEADLINE_EPOCH - $(date +%s)))"
          ((remaining > 0)) || exit 124
          /usr/bin/time -v -o "$DEV_V1_EVIDENCE_ROOT/timing/build.time" \
            timeout --signal=TERM --kill-after=30s "${remaining}s" \
            dotnet build HVO.SkyMonitor.v9.slnx \
              --no-restore \
              --configuration Release \
              -warnaserror

      # Whole-repository ShellCheck and exhaustive category discovery are owned by
      # ci.yml's Quality and Build jobs on the main/release qualification path (#1142).
      # The terminal programs' render tests save each screen to HVO_TERMINAL_RENDERS_DIR (#1317), inside the evidence.
      - name: Run Docker-disabled Unit selection
        id: unit
        env:
          DOCKER_HOST: unix:///tmp/hvo-no-docker.sock
          HVO_TERMINAL_RENDERS_DIR: ${{ runner.temp }}/development-v1/terminal-renders
        run: |
          ./scripts/coverage:development-v1 --settings "$DEV_V1_EVIDENCE_ROOT/coverage.runsettings"
          remaining="$((DEV_V1_DEADLINE_EPOCH - $(date +%s)))"
          ((remaining > 0)) || exit 124
          /usr/bin/time -v -o "$DEV_V1_EVIDENCE_ROOT/timing/unit.time" \
            timeout --signal=TERM --kill-after=30s "${remaining}s" \
            dotnet test HVO.SkyMonitor.v9.slnx \
              --no-build \
              --configuration Release \
              --filter "TestCategory=Unit" \
              --settings "$DEV_V1_EVIDENCE_ROOT/coverage.runsettings" \
              --collect:"XPlat Code Coverage" \
              --results-directory "$DEV_V1_EVIDENCE_ROOT/unit" \
              --logger trx

      - name: Enforce canonical per-file coverage floors
        id: coverage
        run: |
          remaining="$((DEV_V1_DEADLINE_EPOCH - $(date +%s)))"
          ((remaining > 0)) || exit 124
          # The timed child expands the exported evidence directory.
          # shellcheck disable=SC2016
          /usr/bin/time -v -o "$DEV_V1_EVIDENCE_ROOT/timing/coverage.time" \
            timeout --signal=TERM --kill-after=30s "${remaining}s" \
            bash -euo pipefail -c '
              dotnet tool restore
              ./scripts/test:coverage-development-v1
              ./scripts/coverage:development-v1 "$DEV_V1_EVIDENCE_ROOT/unit" "$DEV_V1_EVIDENCE_ROOT/coverage"
            '

      # Those screens drawn as SVG, as docs/images/terminal has them, and kept with the evidence below (#1317).
      - name: Draw terminal screenshots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$DEV_V1_EVIDENCE_ROOT/terminal-renders"
          ./scripts/docs:terminal-screenshots --draw "$DEV_V1_EVIDENCE_ROOT/terminal-renders"

      - name: Write evidence summary
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          read_metric() {
            local file="$1" label="$2"
            [[ -f "$file" ]] || return 0
            awk -v label="$label" 'index($0, label) { sub(/^.*: /, ""); print; exit }' "$file"
          }
          stage_json() {
            local stage="$1" outcome="$2" file="$DEV_V1_EVIDENCE_ROOT/timing/$1.time"
            jq -n \
              --arg name "$stage" \
              --arg outcome "$outcome" \
              --arg elapsed "$(read_metric "$file" 'Elapsed (wall clock) time')" \
              --arg rss "$(read_metric "$file" 'Maximum resident set size (kbytes)')" \
              '{name:$name,outcome:$outcome,elapsed:$elapsed,largestProcessRssKilobytes:($rss|if length==0 then null else tonumber end)}'
          }
          completed_at="$(date +%s)"
          trx_count="$(find "$DEV_V1_EVIDENCE_ROOT/unit" -name '*.trx' -type f | wc -l)"
          jq -n \
            --arg schema hvo-development-v1-ci-v5 \
            --arg headSha "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg sdkVersion "$(dotnet --version 2>/dev/null || true)" \
            --argjson elapsed "$((completed_at - DEV_V1_STARTED_AT_EPOCH))" \
            --argjson trxCount "$trx_count" \
            --argjson restore "$(stage_json restore "$RESTORE_OUTCOME")" \
            --argjson build "$(stage_json build "$BUILD_OUTCOME")" \
            --argjson unit "$(stage_json unit "$UNIT_OUTCOME")" \
            --argjson coverage "$(stage_json coverage "$COVERAGE_OUTCOME")" \
            '{schema:$schema,profile:"development-v1",headSha:$headSha,event:$event,sdkVersion:$sdkVersion,runnerElapsedThroughSummaryStartSeconds:$elapsed,targetSeconds:600,workloadBudgetSeconds:1080,hardTimeoutSeconds:1320,unitTrxCount:$trxCount,memoryMetric:"GNU time ru_maxrss: largest single process",stages:[$restore,$build,$unit,$coverage],qualificationWorkflow:"ci.yml",qualificationOnlyChecks:["whole-repository-shellcheck","exhaustive-test-category-discovery"]}' \
            > "$DEV_V1_EVIDENCE_ROOT/manifest.json"
          jq . "$DEV_V1_EVIDENCE_ROOT/manifest.json"

      - name: Upload development CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: development-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/development-v1/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

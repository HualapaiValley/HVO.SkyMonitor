name: Stellarium Oracle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: stellarium-oracle
  cancel-in-progress: false

jobs:
  validate:
    name: Pinned headless validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate static contract
        run: ./scripts/test:stellarium

      - name: Run pinned Stellarium container
        run: ./scripts/validate:stellarium-container

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stellarium-oracle-${{ github.run_id }}
          path: TestResults/stellarium/**
          if-no-files-found: warn
          retention-days: 30

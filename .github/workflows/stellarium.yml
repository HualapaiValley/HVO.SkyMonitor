name: Stellarium Oracle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: stellarium-oracle
  cancel-in-progress: false

jobs:
  validate:
    name: Pinned headless validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate static contract
        run: ./scripts/test:stellarium

      - name: Run pinned Stellarium container
        run: ./scripts/validate:stellarium-container

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stellarium-oracle-${{ github.run_id }}
          path: TestResults/stellarium/**
          if-no-files-found: warn
          retention-days: 30

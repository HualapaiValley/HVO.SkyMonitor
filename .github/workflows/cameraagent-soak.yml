name: CameraAgent Real-Duration Soak

on:
  workflow_dispatch:
    inputs:
      duration:
        description: GNU timeout duration (for example 8h or 24h)
        required: true
        default: 24h

permissions:
  contents: read

concurrency:
  group: cameraagent-real-duration-soak
  cancel-in-progress: false

jobs:
  accelerated:
    name: Accelerated Soak
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Run accelerated soak category
        run: |
          dotnet restore tests/HVO.SkyMonitor.CameraAgent.Tests/HVO.SkyMonitor.CameraAgent.Tests.csproj
          dotnet test tests/HVO.SkyMonitor.CameraAgent.Tests/HVO.SkyMonitor.CameraAgent.Tests.csproj --configuration Release --filter "TestCategory=Soak" --results-directory TestResults/accelerated-soak --logger "trx;LogFileName=accelerated-soak.trx"
      - name: Upload accelerated soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accelerated-soak-${{ github.run_id }}
          path: TestResults/accelerated-soak/
          if-no-files-found: error
          retention-days: 30

  soak:
    needs: accelerated
    runs-on: [self-hosted, linux, skymonitor-soak]
    timeout-minutes: 1560
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Run CameraAgent soak
        env:
          SOAK_DURATION: ${{ inputs.duration }}
        run: ./scripts/run:cameraagent-soak "$SOAK_DURATION"
      - name: Upload compact diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cameraagent-soak-${{ github.run_id }}
          path: |
            TestResults/cameraagent-soak/*/report.json
            TestResults/cameraagent-soak/*/cameraagent.log
          if-no-files-found: error
          retention-days: 30

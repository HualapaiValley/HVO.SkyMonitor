name: CameraAgent Real-Duration Soak

on:
  workflow_dispatch:
    inputs:
      duration:
        description: GNU timeout duration (for example 8h or 24h)
        required: true
        default: 24h

permissions:
  contents: read

jobs:
  soak:
    runs-on: [self-hosted, linux, skymonitor-soak]
    timeout-minutes: 1560
    steps:
      - uses: actions/checkout@v6
      - name: Run CameraAgent soak
        env:
          SOAK_DURATION: ${{ inputs.duration }}
        run: ./scripts/run:cameraagent-soak "$SOAK_DURATION"
      - name: Remove any interrupted soak container
        if: always()
        run: |
          docker ps -aq --filter 'name=hvo-cameraagent-soak-' | xargs -r docker rm -f
          find TestResults/cameraagent-soak -type d -name data -prune -exec rm -rf {} + 2>/dev/null || true
      - name: Upload compact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cameraagent-soak-${{ github.run_id }}
          path: |
            TestResults/cameraagent-soak/*/report.json
            TestResults/cameraagent-soak/*/cameraagent.log
          retention-days: 30

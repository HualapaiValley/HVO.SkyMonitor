name: CameraAgent ARM64 Advisory

on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Full commit SHA covered by the converged review
        required: true
        type: string
  repository_dispatch:
    types: [cameraagent-arm64]
  schedule:
    - cron: '30 6 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cameraagent-arm64-advisory
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  catalog-contracts:
    name: Canonical Catalog Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify manually dispatched reviewed head
        if: github.event_name == 'workflow_dispatch'
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
        run: |
          if [[ ! "$REVIEWED_HEAD" =~ ^[0-9a-f]{40}$ || "$REVIEWED_HEAD" != "$GITHUB_SHA" ]]; then
            echo '::error::Dispatch head does not match the full reviewed commit SHA.'
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build exact production catalog contract
        run: |
          catalog_root="$RUNNER_TEMP/hyg-v44-contracts"
          ./scripts/catalog/prepare-hyg-v44-contracts.sh "$catalog_root" >/dev/null
      - name: Build and verify the pinned standalone OpenNGC bundle
        timeout-minutes: 3
        run: |
          started=$SECONDS
          catalog_root="$RUNNER_TEMP/hyg-v44-contracts"
          bundle=openngc/openngc-v20260501-p6-s5-r1.bundle
          ./scripts/catalog/fetch-openngc-inputs.sh "$RUNNER_TEMP/openngc-inputs"
          ./scripts/catalog/build-openngc.sh --openngc-source "$RUNNER_TEMP/openngc-inputs" "$catalog_root/openngc"
          cd "$catalog_root"
          sha256sum "$bundle"/* > openngc.sha256
          jq -n --arg headSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg architecture "$(uname -m)" \
            --argjson buildSeconds "$((SECONDS - started))" \
            --slurpfile manifest "$bundle/manifest.json" \
            '{headSha:$headSha,runId:$runId,producerAttempt:$attempt,producerArchitecture:$architecture,
              buildSeconds:$buildSeconds,package:$manifest[0].package.version,source:$manifest[0].source.downloadUrl}' \
            > openngc-fixture.json
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Run hosted OpenNGC restore, catalog, installer, and lifecycle contracts
        id: openngc-contracts
        timeout-minutes: 5
        shell: bash
        env:
          HVO_PRODUCTION_CATALOG_BUNDLE: ${{ runner.temp }}/hyg-v44-contracts/build/hyg-v4.4-p4-s3-r1.bundle
          HVO_OPENNGC_CATALOG_BUNDLE: ${{ runner.temp }}/hyg-v44-contracts/openngc/openngc-v20260501-p6-s5-r1.bundle
        run: |
          evidence="$RUNNER_TEMP/openngc-contract-evidence"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/hyg-v44-contracts/"{openngc-fixture.json,openngc.sha256} "$evidence/"
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps \
            --target "$RUNNER_TEMP/hvo-pyyaml" -r scripts/ci/pyyaml-requirements.txt
          PYTHONPATH="$RUNNER_TEMP/hvo-pyyaml" ./scripts/test:cameraagent-arm64-restore \
            --pinned-bundles "$HVO_PRODUCTION_CATALOG_BUNDLE" "$HVO_OPENNGC_CATALOG_BUNDLE" \
            2>&1 | tee "$evidence/arm64-restore-replay.log"
          ./scripts/test:openngc-contracts "$evidence"
      - name: Upload hosted OpenNGC contract evidence
        if: ${{ !cancelled() && (steps.openngc-contracts.outcome == 'success' || steps.openngc-contracts.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hosted-openngc-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openngc-contract-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Archive exact production catalog contracts
        run: tar -czf "$RUNNER_TEMP/catalog-contracts.tar.gz" -C "$RUNNER_TEMP/hyg-v44-contracts" .
      - name: Upload exact production catalog contract
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arm64-catalog-contracts-${{ github.run_id }}
          path: ${{ runner.temp }}/catalog-contracts.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  cameraagent-arm64:
    name: Native CameraAgent Evidence
    needs: catalog-contracts
    runs-on: [self-hosted, linux, ARM64, hvo-skymonitor-arm64]
    timeout-minutes: 90
    steps:
      - name: Initialize pre-checkout evidence
        run: |
          evidence="$RUNNER_TEMP/arm64-workflow-start-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence"
          jq -n --arg startedUtc "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{schemaVersion:"hvo-arm64-workflow-start-v1",startedUtc:$startedUtc}' > "$evidence/workflow-start.json"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize evidence directory
        run: |
          evidence="TestResults/issue-381/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/arm64-workflow-start-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/workflow-start.json" "$evidence/"
      - name: Download exact production catalog contract
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: arm64-catalog-contracts-${{ github.run_id }}
          path: ${{ runner.temp }}/hyg-v44-contract-artifact-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore exact production catalog contract
        run: |
          catalog_root="$RUNNER_TEMP/hyg-v44-contracts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$catalog_root"
          tar -xzf "$RUNNER_TEMP/hyg-v44-contract-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/catalog-contracts.tar.gz" -C "$catalog_root"
          bundle_path="$catalog_root/build/hyg-v4.4-p4-s3-r1.bundle"
          openngc_bundle="$catalog_root/openngc/openngc-v20260501-p6-s5-r1.bundle"
          # The Deployment.Cli installer and lifecycle contracts skip themselves with
          # Assert.Inconclusive when this bundle is absent, and a skipped MSTest records
          # notExecuted="0" and inconclusive="0" in its TRX, so the job stays green having
          # executed none of them. Fail here, where the cause is visible, rather than let a
          # broken artifact restore turn into a green run that proved nothing.
          test -d "$bundle_path" ||
            { printf 'Catalog bundle missing after restore: %s\n' "$bundle_path" >&2; exit 1; }
          test -d "$openngc_bundle" ||
            { printf 'OpenNGC bundle missing after restore: %s\n' "$openngc_bundle" >&2; exit 1; }
          # A native-only retry can reuse the producer artifact from an earlier attempt of this same run.
          jq -e --arg head "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '.headSha == $head and .runId == $run' "$catalog_root/openngc-fixture.json" >/dev/null ||
            { printf 'OpenNGC bundle provenance does not match the workflow run and commit.\n' >&2; exit 1; }
          database="$openngc_bundle/openngc.sqlite"
          [[ -f "$database" && ! -L "$database" ]] ||
            { printf 'Restored OpenNGC database must be a regular file: %s\n' "$database" >&2; exit 1; }
          (cd "$catalog_root" && sha256sum --check --strict openngc.sha256)
          # The transfer ledger travels with the artifact. Check the bytes against the reviewed checkout.
          digest="$(sha256sum < "$database")"
          length="$(stat -c %s -- "$database")"
          jq -e --arg hash "${digest%% *}" --argjson bytes "$length" '
            [.specifications[] | select(.catalogId == "openngc-production")] |
            length == 1 and (.[0].database | .sha256 == $hash and .length == $bytes)
          ' src/HVO.SkyMonitor.Catalog.Sqlite/ApprovedCatalogSpecifications.json >/dev/null ||
            { printf 'Restored OpenNGC database does not match the approved SHA-256 and length.\n' >&2; exit 1; }
          cp "$catalog_root/"{openngc-fixture.json,openngc.sha256} \
            "$RUNNER_TEMP/arm64-workflow-start-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"
          {
            printf 'HVO_PRODUCTION_CATALOG_BUNDLE=%s\n' "$bundle_path"
            printf 'HVO_OPENNGC_CATALOG_BUNDLE=%s\n' "$openngc_bundle"
          } >> "$GITHUB_ENV"
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Run native ARM64 build, test, publish, and smoke
        run: ./scripts/test:cameraagent-arm64-ci "$HVO_PRODUCTION_CATALOG_BUNDLE"
      - name: Upload native ARM64 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cameraagent-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/issue-381/${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/arm64-workflow-start-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
      - name: Remove run-scoped workflow inputs
        if: always()
        run: |
          chmod -R u+w \
            "$RUNNER_TEMP/hyg-v44-contracts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/hyg-v44-contract-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/arm64-workflow-start-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true
          rm -rf -- \
            "$RUNNER_TEMP/hyg-v44-contracts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/hyg-v44-contract-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/arm64-workflow-start-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

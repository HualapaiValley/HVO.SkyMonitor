name: CI v2 Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  hosted-baseline:
    name: Hosted restore, build, and Unit baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record experiment start
        run: |
          printf 'CI_V2_STARTED_AT_EPOCH=%s\n' "$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Prepare evidence directories
        run: mkdir -p TestResults/ci-v2-baseline/timing TestResults/ci-v2-baseline/unit

      - name: Restore solution
        id: restore
        run: |
          /usr/bin/time -v -o TestResults/ci-v2-baseline/timing/restore.time \
            dotnet restore HVO.SkyMonitor.v9.slnx

      - name: Build warning-clean Release solution
        id: build
        run: |
          /usr/bin/time -v -o TestResults/ci-v2-baseline/timing/build.time \
            dotnet build HVO.SkyMonitor.v9.slnx \
              --no-restore \
              --configuration Release \
              -warnaserror

      - name: Run Docker-disabled Unit selection
        id: unit
        env:
          DOCKER_HOST: unix:///tmp/hvo-no-docker.sock
        run: |
          /usr/bin/time -v -o TestResults/ci-v2-baseline/timing/unit.time \
            dotnet test HVO.SkyMonitor.v9.slnx \
              --no-build \
              --configuration Release \
              --filter "TestCategory=Unit" \
              --results-directory TestResults/ci-v2-baseline/unit \
              --logger trx

      - name: Write timing manifest
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          read_metric() {
            local file="$1" label="$2"
            [[ -f "$file" ]] || return 0
            awk -F ': ' -v label="$label" '$1 ~ label { print $2; exit }' "$file"
          }

          timing_json() {
            local stage="$1" outcome="$2" file="TestResults/ci-v2-baseline/timing/$1.time"
            jq -n \
              --arg stage "$stage" \
              --arg outcome "$outcome" \
              --arg elapsed "$(read_metric "$file" 'Elapsed \(wall clock\) time')" \
              --arg user "$(read_metric "$file" 'User time \(seconds\)')" \
              --arg system "$(read_metric "$file" 'System time \(seconds\)')" \
              --arg rss "$(read_metric "$file" 'Maximum resident set size \(kbytes\)')" \
              '{stage:$stage,outcome:$outcome,elapsed:$elapsed,userSeconds:$user,systemSeconds:$system,peakRssKilobytes:($rss | if length == 0 then null else tonumber end)}'
          }

          completed_at_epoch="$(date +%s)"
          sdk_version="$(dotnet --version 2>/dev/null || true)"
          trx_count="$(find TestResults/ci-v2-baseline/unit -type f -name '*.trx' | wc -l)"
          evidence_bytes="$(find TestResults/ci-v2-baseline -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          jq -n \
            --arg schema 'hvo-ci-v2-baseline-v1' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg headSha "$HEAD_SHA" \
            --arg runId "$RUN_ID" \
            --arg runAttempt "$RUN_ATTEMPT" \
            --arg runnerName "$RUNNER_NAME" \
            --arg runnerOs "$RUNNER_OS" \
            --arg runnerArch "$RUNNER_ARCH" \
            --arg runnerImage "${ImageOS-unknown}" \
            --arg sdkVersion "$sdk_version" \
            --argjson totalElapsedSeconds "$((completed_at_epoch - CI_V2_STARTED_AT_EPOCH))" \
            --argjson trxCount "$trx_count" \
            --argjson evidenceBytes "$evidence_bytes" \
            --argjson restore "$(timing_json restore "$RESTORE_OUTCOME")" \
            --argjson build "$(timing_json build "$BUILD_OUTCOME")" \
            --argjson unit "$(timing_json unit "$UNIT_OUTCOME")" \
            '{schema:$schema,repository:$repository,event:$event,headSha:$headSha,runId:($runId|tonumber),runAttempt:($runAttempt|tonumber),runner:{name:$runnerName,os:$runnerOs,arch:$runnerArch,image:$runnerImage},sdkVersion:$sdkVersion,totalElapsedSeconds:$totalElapsedSeconds,targetElapsedSeconds:600,unitTrxCount:$trxCount,evidenceBytesBeforeUpload:$evidenceBytes,stages:[$restore,$build,$unit]}' \
            > TestResults/ci-v2-baseline/manifest.json

          find TestResults/ci-v2-baseline -type f -printf '%P %s bytes\n' | sort
          jq . TestResults/ci-v2-baseline/manifest.json

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-v2-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/ci-v2-baseline/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

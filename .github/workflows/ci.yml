name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: Change Classification
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      deployment: ${{ steps.classify.outputs.deployment }}
      deployment_catalog: ${{ steps.classify.outputs.deployment_catalog }}
      deployment_shards: ${{ steps.classify.outputs.deployment_shards }}
      deployment_installer: ${{ steps.classify.outputs.deployment_installer }}
      complete: ${{ steps.classify.outputs.complete }}
      shared: ${{ steps.classify.outputs.shared }}
      cameraagent: ${{ steps.classify.outputs.cameraagent }}
      logichost: ${{ steps.classify.outputs.logichost }}
      combined: ${{ steps.classify.outputs.combined }}
      delivery: ${{ steps.classify.outputs.delivery }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select full or reduced CI
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci:classify "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  catalog-contracts:
    name: Catalog Contracts
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build exact production catalog contracts
        run: |
          ./scripts/catalog/smoke-test.sh
          catalog_root="$RUNNER_TEMP/hyg-v42-contracts"
          ./scripts/catalog/prepare-hyg-v42-contracts.sh "$catalog_root" >/dev/null
          tar -czf "$RUNNER_TEMP/hyg-v42-contracts.tar.gz" -C "$catalog_root" .
          ./scripts/ci:artifact-provenance hyg-v42-contracts catalog-contracts "$RUNNER_TEMP/hyg-v42-contract-provenance"
      - name: Upload exact production catalog contracts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hyg-v42-contracts
          path: |
            ${{ runner.temp }}/hyg-v42-contracts.tar.gz
            ${{ runner.temp }}/hyg-v42-contract-provenance/ci-artifact-provenance.json
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Quality
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        if: needs.changes.outputs.mode == 'full'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore dependencies and tools
        if: needs.changes.outputs.mode == 'full'
        run: |
          dotnet tool restore
          dotnet restore HVO.SkyMonitor.v9.slnx
      - name: Verify formatting
        if: needs.changes.outputs.mode == 'full'
        run: dotnet format HVO.SkyMonitor.v9.slnx --no-restore --verify-no-changes
      - name: Lint GitHub Actions workflows
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' /tmp/actionlint.tar.gz | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
      - name: Run static and lightweight contract checks
        run: |
          ./scripts/ci:shell-syntax
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.linux.x86_64.tar.xz
          printf '%s  %s\n' \
            '700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f' \
            "$RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          export HVO_SHELLCHECK_BIN="$RUNNER_TEMP/shellcheck-v0.9.0/shellcheck"
          ./scripts/ci:shellcheck
          ./scripts/docs:audit-operations
          ./scripts/test:coordination-guard
          ./scripts/test:pr-review-tools
          ./scripts/test:trx-evidence-contract
          ./scripts/test:issue-211-w6-identity
          ./scripts/test:cameraagent-final-head-535
          ./scripts/test:record-cameraagent-final-head-535
          ./scripts/test:cameraagent-final-head-ci-import-535
          ./scripts/test:cameraagent-final-head-components-535
          ./scripts/test:assemble-cameraagent-final-head-535
          ./scripts/test:ci-artifact-provenance
          ./scripts/test:ci-shell-syntax
          ./scripts/test:ci-shellcheck
          ./scripts/test:infra
          ./scripts/test:smoke-env
          ./scripts/test:devcontainer
          bash ./scripts/test:ci-classification
          SQLSERVER_PASSWORD=validation-only REDIS_PASSWORD=validation-only CAMERA_AGENT_ADMIN_PASSWORD=validation-only-password CAMERA_AGENT_OAUTH_CLIENT_SECRET=validation-only-oauth-secret docker compose --env-file .env.template -f docker-compose.apps.yml config --quiet
          REDIS_PASSWORD=validation-only docker compose --env-file .env.template -f deploy/hvo-docker/docker-compose.shared-services.yml config --quiet
          HVO_RUN_ID=ci-validation HVO_INVENTORY_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa HVO_CONFIG_ROOT=/srv/hvo/config HVO_STATE_ROOT=/srv/hvo/state HVO_RUNTIME_UID=1000 HVO_RUNTIME_GID=1000 HVO_SQL_MEMORY=4G MSSQL_MEMORY_LIMIT_MB=3072 SQLSERVER_PORT=1433 REDIS_PORT=6379 SMTP_PORT=1025 MAILPIT_HTTP_PORT=8025 SQLSERVER_IMAGE=example/sql@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa REDIS_IMAGE=example/redis@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb MAILPIT_IMAGE=example/mailpit@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee SQL_DATABASE=hvo-test SQL_ADMIN_USER=sa SQL_INITIALIZER_USER=hvo-init SQL_RUNTIME_USER=hvo-runtime REDIS_RUNTIME_USER=hvo-runtime REDIS_PREFIX=hvo-test: docker compose -f deploy/split-host/compose.shared-services.yml --profile provision --profile test-smtp config --quiet
          HVO_RUN_ID=ci-validation HVO_INVENTORY_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa HVO_CONFIG_ROOT=/srv/hvo/config HVO_STATE_ROOT=/srv/hvo/state HVO_CATALOG_ROOT=/srv/hvo/catalog HVO_CONTAINER_NAME=hvo-skymonitor-11111111111141118111111111111111 HVO_PUBLIC_PORT=5174 HVO_OBJECT_STORE_ROOT=/var/lib/hvo/object-store HVO_RUNTIME_UID=4242 HVO_RUNTIME_GID=4343 LOGICHOST_IMAGE=example/logichost@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa docker compose -f deploy/split-host/compose.logichost.yml --profile initialize config --quiet
          HVO_RUN_ID=ci-validation HVO_INVENTORY_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa HVO_CONFIG_ROOT=/srv/hvo/config HVO_STATE_ROOT=/srv/hvo/state HVO_CATALOG_ROOT=/srv/hvo/catalog HVO_CONTAINER_NAME=hvo-skymonitor-22222222222242228222222222222222 HVO_PUBLIC_PORT=5130 CAMERAAGENT_IMAGE=example/cameraagent@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb docker compose -f deploy/split-host/compose.cameraagent.yml config --quiet
          docker compose --env-file deploy/acceptance/cameraagent-dual-standalone-smoke/compose.validation.env.template -f deploy/acceptance/cameraagent-dual-standalone-smoke/compose.yml config --quiet
      - name: Audit vulnerable and deprecated packages
        if: needs.changes.outputs.mode == 'full'
        run: |
          ./scripts/package:audit
          ./scripts/ci:artifact-provenance package-audit quality TestResults/package-audit
      - name: Upload package audit
        if: always() && needs.changes.outputs.mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-audit
          path: TestResults/package-audit/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Run historical Phase 14 acceptance inventory contract
        if: needs.changes.outputs.mode == 'full' && github.event_name == 'workflow_dispatch'
        run: ./scripts/test:phase14-acceptance
  deployment-contracts:
    name: Deployment Contracts
    needs: [changes, catalog-contracts]
    if: needs.changes.outputs.deployment == 'true'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact production catalog contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hyg-v42-contracts
          path: ${{ runner.temp }}/hyg-v42-contract-artifact
      - name: Restore exact production catalog contracts
        run: |
          catalog_root="$RUNNER_TEMP/hyg-v42-contracts"
          mkdir -m 700 "$catalog_root"
          tar -xzf "$RUNNER_TEMP/hyg-v42-contract-artifact/hyg-v42-contracts.tar.gz" -C "$catalog_root"
          bundle_path="$catalog_root/build/hyg-v4.2-p3-s2-r1.bundle"
          # The Deployment.Cli installer and lifecycle contracts skip themselves with
          # Assert.Inconclusive when this bundle is absent, and a skipped MSTest records
          # notExecuted="0" and inconclusive="0" in its TRX, so the job stays green having
          # executed none of them. Fail here, where the cause is visible, rather than let a
          # broken artifact restore turn into a green run that proved nothing.
          test -d "$bundle_path" ||
            { printf 'Catalog bundle missing after restore: %s\n' "$bundle_path" >&2; exit 1; }
          printf 'HVO_PRODUCTION_CATALOG_BUNDLE=%s\n' "$bundle_path" >> "$GITHUB_ENV"
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify deployment contract tools
        run: |
          test "$(dotnet --version)" = "$(jq -r '.sdk.version' global.json)"
          command -v bash curl docker git jq nproc setsid sha256sum sqlite3 >/dev/null
          if (( BASH_VERSINFO[0] < 5 || (BASH_VERSINFO[0] == 5 && BASH_VERSINFO[1] < 1) )); then
            printf 'Bash 5.1 or newer is required for deployment shard coordination.\n' >&2
            exit 1
          fi
          ./scripts/test:deploy-environment --list-shards
          ./scripts/ci:shell-syntax scripts/test:deployment-installer \
            scripts/test:deployment-installer-qualification \
            scripts/qualify:filesystem-object-store \
            scripts/test:filesystem-object-store-qualification \
            scripts/lib/deployment-installer-qualification.sh
          ./scripts/test:deployment-installer-qualification
      - name: Run exhaustive production catalog lifecycle
        if: needs.changes.outputs.deployment_catalog == 'true'
        run: |
          ./scripts/catalog/test-hyg-v42-install.sh \
            "$RUNNER_TEMP/hyg-v42-contracts/build/hyg-v4.2-p3-s2-r1.bundle"
      - name: Run lightweight deployment contracts
        run: |
          ./scripts/test:deploy-environment-cli
          ./scripts/test:deployment-logichost-outage-contract
          ./scripts/test:deployment-normal-flow-contract
          ./scripts/test:filesystem-object-store-qualification
      - name: Run exhaustive deployment contracts in parallel
        if: needs.changes.outputs.deployment_shards == 'true'
        run: ./scripts/test:deploy-environment --parallel
      - name: Run exhaustive disposable offline installer contract
        if: needs.changes.outputs.deployment_installer == 'true'
        run: ./scripts/test:deployment-installer
      - name: Bind deployment contract evidence
        if: always() && needs.changes.outputs.deployment_shards == 'true'
        run: ./scripts/ci:artifact-provenance deployment-contract-logs deployment-contracts TestResults/deployment-contracts
      - name: Upload deployment contract logs
        if: always() && needs.changes.outputs.deployment_shards == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployment-contract-logs
          path: TestResults/deployment-contracts/
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore HVO.SkyMonitor.v9.slnx
      - name: Warning-clean Debug build
        run: dotnet build HVO.SkyMonitor.v9.slnx --no-restore --no-incremental --configuration Debug -warnaserror
      - name: Warning-clean Release build
        run: dotnet build HVO.SkyMonitor.v9.slnx --no-restore --no-incremental --configuration Release -warnaserror
      - name: Audit behavioral test categories
        run: dotnet run --project scripts/test-categories/HVO.SkyMonitor.TestCategoryAudit.csproj --configuration Release

  unit:
    name: Unit Tests
    needs: [changes, catalog-contracts]
    if: needs.changes.outputs.complete == 'true'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 20
    env:
      DOCKER_HOST: unix:///tmp/hvo-unit-docker-must-not-exist.sock
      UNIT_FILTER: TestCategory=Unit&TestCategory!=Integration&TestCategory!=Manual&TestCategory!=Soak&TestCategory!=External&TestCategory!=Hardware
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact production catalog contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hyg-v42-contracts
          path: ${{ runner.temp }}/hyg-v42-contract-artifact
      - name: Restore exact production catalog contract
        run: |
          catalog_root="$RUNNER_TEMP/hyg-v42-contracts"
          mkdir -m 700 "$catalog_root"
          tar -xzf "$RUNNER_TEMP/hyg-v42-contract-artifact/hyg-v42-contracts.tar.gz" -C "$catalog_root"
          bundle_path="$catalog_root/build/hyg-v4.2-p3-s2-r1.bundle"
          # The Deployment.Cli installer and lifecycle contracts skip themselves with
          # Assert.Inconclusive when this bundle is absent, and a skipped MSTest records
          # notExecuted="0" and inconclusive="0" in its TRX, so the job stays green having
          # executed none of them. Fail here, where the cause is visible, rather than let a
          # broken artifact restore turn into a green run that proved nothing.
          test -d "$bundle_path" ||
            { printf 'Catalog bundle missing after restore: %s\n' "$bundle_path" >&2; exit 1; }
          printf 'HVO_PRODUCTION_CATALOG_BUNDLE=%s\n' "$bundle_path" >> "$GITHUB_ENV"
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore and build Release
        run: |
          dotnet restore HVO.SkyMonitor.v9.slnx
          dotnet build HVO.SkyMonitor.v9.slnx --no-restore --configuration Release
      - name: Run Docker-disabled Unit suites
        run: |
          dotnet test tests/HVO.SkyMonitor.Astronomy.Tests/HVO.SkyMonitor.Astronomy.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/astronomy --logger "trx;LogFileName=unit-astronomy.trx"
          dotnet test tests/HVO.SkyMonitor.Imaging.Tests/HVO.SkyMonitor.Imaging.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/imaging --logger "trx;LogFileName=unit-imaging.trx"
          dotnet test tests/HVO.SkyMonitor.Processing.Tests/HVO.SkyMonitor.Processing.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/processing --logger "trx;LogFileName=unit-processing.trx"
          dotnet test tests/HVO.SkyMonitor.ProcessingRunner.Tests/HVO.SkyMonitor.ProcessingRunner.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/processing-runner --logger "trx;LogFileName=unit-processing-runner.trx"
          dotnet test tests/HVO.SkyMonitor.Catalog.Sqlite.Tests/HVO.SkyMonitor.Catalog.Sqlite.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/catalog-sqlite --logger "trx;LogFileName=unit-catalog-sqlite.trx"
          dotnet test tests/HVO.SkyMonitor.Storage.FileSystem.Tests/HVO.SkyMonitor.Storage.FileSystem.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/storage-filesystem --logger "trx;LogFileName=unit-storage-filesystem.trx"
          dotnet test tests/HVO.SkyMonitor.Deployment.Cli.Tests/HVO.SkyMonitor.Deployment.Cli.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/deployment-cli --logger "trx;LogFileName=unit-deployment-cli.trx"
          dotnet test tests/HVO.SkyMonitor.Deployment.Distribution.Tests/HVO.SkyMonitor.Deployment.Distribution.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/deployment-distribution --logger "trx;LogFileName=unit-deployment-distribution.trx"
          dotnet test tests/HVO.SkyMonitor.AgentCore.Tests/HVO.SkyMonitor.AgentCore.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/agent-core --logger "trx;LogFileName=unit-agent-core.trx"
          dotnet test tests/HVO.SkyMonitor.Common.Tests/HVO.SkyMonitor.Common.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/common --logger "trx;LogFileName=unit-common.trx"
          dotnet test tests/HVO.SkyMonitor.Fleet.Contracts.Tests/HVO.SkyMonitor.Fleet.Contracts.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/fleet-contracts --logger "trx;LogFileName=unit-fleet-contracts.trx"
          dotnet test tests/HVO.SkyMonitor.TestSupport.Tests/HVO.SkyMonitor.TestSupport.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/test-support --logger "trx;LogFileName=unit-test-support.trx"
          dotnet test tests/HVO.SkyMonitor.Architecture.Tests/HVO.SkyMonitor.Architecture.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/architecture --logger "trx;LogFileName=unit-architecture.trx"
          dotnet test tests/HVO.SkyMonitor.CameraAgent.Tests/HVO.SkyMonitor.CameraAgent.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/cameraagent --logger "trx;LogFileName=unit-cameraagent.trx"
          dotnet test tests/HVO.SkyMonitor.CameraAgent.AcceptanceTests/HVO.SkyMonitor.CameraAgent.AcceptanceTests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/cameraagent-acceptance --logger "trx;LogFileName=unit-cameraagent-acceptance.trx"
          dotnet test tests/HVO.SkyMonitor.LogicHost.Tests/HVO.SkyMonitor.LogicHost.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/logichost --logger "trx;LogFileName=unit-logichost.trx"
          dotnet test tests/HVO.SkyMonitor.CameraAgent.LogicHost.Tests/HVO.SkyMonitor.CameraAgent.LogicHost.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/cameraagent-logichost --logger "trx;LogFileName=unit-cameraagent-logichost.trx"
      - name: Bind Unit evidence
        if: always()
        run: ./scripts/ci:artifact-provenance unit-test-evidence unit TestResults/unit
      - name: Upload Unit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-evidence
          path: TestResults/unit/
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.complete == 'true'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 35
    env:
      INTEGRATION_FILTER: TestCategory=Integration&TestCategory!=Soak&TestCategory!=Manual&TestCategory!=External&TestCategory!=Hardware
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore and build Release
        run: |
          dotnet restore HVO.SkyMonitor.v9.slnx
          dotnet build HVO.SkyMonitor.v9.slnx --no-restore --configuration Release
      # The LogicHost assembly is 506s of a 724s serial total (#850, run 35300523583); the
      # other five assemblies sum to 218s. Running LogicHost alone beside the other five
      # takes the step from 729s to 506s (pilot run 35320849748, 669/669 passing, 16-CPU
      # runner at load 0.46) with the identical per-assembly commands, results directories
      # and TRX names, so coverage slots and evidence consumers are unchanged. Each lane
      # keeps its own log; a failure in either lane fails the step after both finish.
      - name: Run Integration suites
        run: |
          mkdir -p TestResults/integration
          # Each lane runs every one of its assemblies even after one fails, so a failing
          # run still produces the complete TRX and coverage set the evidence consumers
          # expect; the lane exit code is the accumulated result.
          logichost_lane() {
            local lane_failed=0
            dotnet test tests/HVO.SkyMonitor.LogicHost.IntegrationTests/HVO.SkyMonitor.LogicHost.IntegrationTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/logichost --logger "trx;LogFileName=integration-logichost.trx" || lane_failed=1
            return "$lane_failed"
          }
          other_lane() {
            local lane_failed=0
            dotnet test tests/HVO.SkyMonitor.CameraAgent.Tests/HVO.SkyMonitor.CameraAgent.Tests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent-storage --logger "trx;LogFileName=integration-cameraagent-storage.trx" || lane_failed=1
            dotnet test tests/HVO.SkyMonitor.CameraAgent.AcceptanceTests/HVO.SkyMonitor.CameraAgent.AcceptanceTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent-standalone --logger "trx;LogFileName=integration-cameraagent-standalone.trx" || lane_failed=1
            dotnet test tests/HVO.SkyMonitor.Astronomy.Tests/HVO.SkyMonitor.Astronomy.Tests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/astronomy --logger "trx;LogFileName=integration-astronomy.trx" || lane_failed=1
            dotnet test tests/HVO.SkyMonitor.CameraAgent.IntegrationTests/HVO.SkyMonitor.CameraAgent.IntegrationTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent --logger "trx;LogFileName=integration-cameraagent.trx" || lane_failed=1
            dotnet test tests/HVO.SkyMonitor.CameraAgent.LogicHost.IntegrationTests/HVO.SkyMonitor.CameraAgent.LogicHost.IntegrationTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent-logichost --logger "trx;LogFileName=integration-cameraagent-logichost.trx" || lane_failed=1
            return "$lane_failed"
          }
          logichost_lane > TestResults/integration/lane-logichost.log 2>&1 &
          logichost_pid=$!
          other_lane > TestResults/integration/lane-other.log 2>&1 &
          other_pid=$!
          failed=0
          wait "$logichost_pid" || failed=1
          wait "$other_pid" || failed=1
          cat TestResults/integration/lane-logichost.log TestResults/integration/lane-other.log
          exit "$failed"
      - name: Bind Integration evidence
        if: always()
        run: ./scripts/ci:artifact-provenance integration-test-evidence integration TestResults/integration
      - name: Upload Integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-evidence
          path: TestResults/integration/
          if-no-files-found: error
          retention-days: 30

  architecture:
    name: Architecture & Publish
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore and build Release
        run: |
          dotnet restore HVO.SkyMonitor.v9.slnx
          dotnet clean HVO.SkyMonitor.v9.slnx --configuration Release
          dotnet build HVO.SkyMonitor.v9.slnx --no-restore --configuration Release
      - name: Validate architecture unit contracts
        env:
          UNIT_FILTER: TestCategory=Unit&TestCategory!=Integration&TestCategory!=Manual&TestCategory!=Soak&TestCategory!=External&TestCategory!=Hardware
        run: dotnet test tests/HVO.SkyMonitor.Architecture.Tests/HVO.SkyMonitor.Architecture.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --results-directory TestResults/architecture-unit --logger "trx;LogFileName=architecture-unit.trx"
      - name: Validate architecture graph and publish outputs
        env:
          HVO_PUBLISH_EVIDENCE_ROOT: ${{ github.workspace }}/TestResults/publish
        run: |
          dotnet test tests/HVO.SkyMonitor.Architecture.Tests/HVO.SkyMonitor.Architecture.Tests.csproj --no-build --configuration Release --filter "TestCategory=Integration&FullyQualifiedName~ArchitectureBoundaryTests" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/architecture --logger "trx;LogFileName=architecture-publish.trx"
          dotnet publish src/HVO.SkyMonitor.Deployment.Cli/HVO.SkyMonitor.Deployment.Cli.csproj --no-restore --configuration Release --runtime linux-x64 --output TestResults/publish/installer/linux-x64
          dotnet publish src/HVO.SkyMonitor.Deployment.Cli/HVO.SkyMonitor.Deployment.Cli.csproj --no-restore --configuration Release --runtime linux-arm64 --output TestResults/publish/installer/linux-arm64
          dotnet publish src/HVO.SkyMonitor.CameraAgent.ReplayRunner/HVO.SkyMonitor.CameraAgent.ReplayRunner.csproj --no-restore --configuration Release --runtime linux-x64 --output TestResults/publish/replay-runner/linux-x64
          dotnet publish src/HVO.SkyMonitor.CameraAgent.ReplayRunner/HVO.SkyMonitor.CameraAgent.ReplayRunner.csproj --no-restore --configuration Release --runtime linux-arm64 --output TestResults/publish/replay-runner/linux-arm64
          dotnet publish src/HVO.SkyMonitor.ProcessingRunner/HVO.SkyMonitor.ProcessingRunner.csproj --no-restore --configuration Release --runtime linux-x64 --output TestResults/publish/processing-runner/linux-x64
          dotnet publish src/HVO.SkyMonitor.ProcessingRunner/HVO.SkyMonitor.ProcessingRunner.csproj --no-restore --configuration Release --runtime linux-arm64 --output TestResults/publish/processing-runner/linux-arm64
          mv TestResults/publish/installer/linux-x64/HVO.SkyMonitor.Deployment.Cli TestResults/publish/installer/linux-x64/hvo-skymonitor
          mv TestResults/publish/installer/linux-arm64/HVO.SkyMonitor.Deployment.Cli TestResults/publish/installer/linux-arm64/hvo-skymonitor
          test -x TestResults/publish/installer/linux-x64/hvo-skymonitor
          test -x TestResults/publish/installer/linux-arm64/hvo-skymonitor
          file TestResults/publish/installer/linux-arm64/hvo-skymonitor | grep -q 'ARM aarch64'
          test -x TestResults/publish/replay-runner/linux-x64/HVO.SkyMonitor.CameraAgent.ReplayRunner
          test -x TestResults/publish/replay-runner/linux-arm64/HVO.SkyMonitor.CameraAgent.ReplayRunner
          TestResults/publish/replay-runner/linux-x64/HVO.SkyMonitor.CameraAgent.ReplayRunner --capabilities > TestResults/publish/replay-runner-linux-x64-capabilities.json
          grep -q '"protocolVersion":1' TestResults/publish/replay-runner-linux-x64-capabilities.json
          grep -q '"status":"Completed"' TestResults/publish/replay-runner-linux-x64-capabilities.json
          file TestResults/publish/replay-runner/linux-arm64/HVO.SkyMonitor.CameraAgent.ReplayRunner | grep -q 'ARM aarch64'
          test -x TestResults/publish/processing-runner/linux-x64/HVO.SkyMonitor.ProcessingRunner
          test -x TestResults/publish/processing-runner/linux-arm64/HVO.SkyMonitor.ProcessingRunner
          TestResults/publish/processing-runner/linux-x64/HVO.SkyMonitor.ProcessingRunner --capabilities > TestResults/publish/processing-runner-linux-x64-capabilities.json
          grep -q '"protocolVersion":1' TestResults/publish/processing-runner-linux-x64-capabilities.json
          grep -q '"warmState":"Warm"' TestResults/publish/processing-runner-linux-x64-capabilities.json
          file TestResults/publish/processing-runner/linux-arm64/HVO.SkyMonitor.ProcessingRunner | grep -q 'ARM aarch64'
      - name: Create retained publish manifests
        run: |
          (cd TestResults/publish/cameraagent && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../cameraagent.sha256)
          (cd TestResults/publish/logichost && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../logichost.sha256)
          (cd TestResults/publish/installer/linux-x64 && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../../installer-linux-x64.sha256)
          (cd TestResults/publish/installer/linux-arm64 && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../../installer-linux-arm64.sha256)
          (cd TestResults/publish/replay-runner/linux-x64 && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../../replay-runner-linux-x64.sha256)
          (cd TestResults/publish/replay-runner/linux-arm64 && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../../replay-runner-linux-arm64.sha256)
          (cd TestResults/publish/processing-runner/linux-x64 && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../../processing-runner-linux-x64.sha256)
          (cd TestResults/publish/processing-runner/linux-arm64 && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../../processing-runner-linux-arm64.sha256)
          cameraagent_files=$(find TestResults/publish/cameraagent -type f | wc -l)
          cameraagent_bytes=$(find TestResults/publish/cameraagent -type f -printf '%s\n' | awk '{total += $1} END {print total}')
          cameraagent_dependencies=$(find TestResults/publish/cameraagent -maxdepth 1 -type f -name '*.dll' | wc -l)
          logichost_files=$(find TestResults/publish/logichost -type f | wc -l)
          logichost_bytes=$(find TestResults/publish/logichost -type f -printf '%s\n' | awk '{total += $1} END {print total}')
          logichost_dependencies=$(find TestResults/publish/logichost -maxdepth 1 -type f -name '*.dll' | wc -l)
          installer_x64_bytes=$(stat -c '%s' TestResults/publish/installer/linux-x64/hvo-skymonitor)
          installer_arm64_bytes=$(stat -c '%s' TestResults/publish/installer/linux-arm64/hvo-skymonitor)
          replay_runner_x64_bytes=$(find TestResults/publish/replay-runner/linux-x64 -type f -printf '%s\n' | awk '{total += $1} END {print total}')
          replay_runner_arm64_bytes=$(find TestResults/publish/replay-runner/linux-arm64 -type f -printf '%s\n' | awk '{total += $1} END {print total}')
          processing_runner_x64_bytes=$(find TestResults/publish/processing-runner/linux-x64 -type f -printf '%s\n' | awk '{total += $1} END {print total}')
          processing_runner_arm64_bytes=$(find TestResults/publish/processing-runner/linux-arm64 -type f -printf '%s\n' | awk '{total += $1} END {print total}')
          printf 'CameraAgent files=%s bytes=%s dependencies=%s\nLogicHost files=%s bytes=%s dependencies=%s\nInstaller linux-x64 bytes=%s\nInstaller linux-arm64 bytes=%s\nReplayRunner linux-x64 bytes=%s\nReplayRunner linux-arm64 bytes=%s\nProcessingRunner linux-x64 bytes=%s\nProcessingRunner linux-arm64 bytes=%s\n' \
            "$cameraagent_files" "$cameraagent_bytes" "$cameraagent_dependencies" \
            "$logichost_files" "$logichost_bytes" "$logichost_dependencies" \
            "$installer_x64_bytes" "$installer_arm64_bytes" \
            "$replay_runner_x64_bytes" "$replay_runner_arm64_bytes" \
            "$processing_runner_x64_bytes" "$processing_runner_arm64_bytes" \
            > TestResults/publish/summary.txt
      - name: Bind architecture and publish evidence
        if: always()
        run: |
          ./scripts/ci:artifact-provenance architecture-unit-evidence architecture TestResults/architecture-unit
          ./scripts/ci:artifact-provenance architecture-test-evidence architecture TestResults/architecture
          ./scripts/ci:artifact-provenance publish-evidence architecture TestResults/publish
      - name: Upload architecture unit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: architecture-unit-evidence
          path: TestResults/architecture-unit/
          if-no-files-found: error
          retention-days: 30
      - name: Upload architecture coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: architecture-test-evidence
          path: TestResults/architecture/
          if-no-files-found: error
          retention-days: 30
      - name: Upload publish evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-evidence
          path: |
            TestResults/publish/*.sha256
            TestResults/publish/summary.txt
            TestResults/publish/*capabilities.json
            TestResults/publish/ci-artifact-provenance.json
          if-no-files-found: error
          retention-days: 30


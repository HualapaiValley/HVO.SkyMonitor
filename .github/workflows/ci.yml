name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: Change Classification
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select full or reduced CI
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci:classify "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore dependencies and tools
        run: |
          dotnet tool restore
          dotnet restore HVO.SkyMonitor.v9.slnx
      - name: Verify formatting
        run: dotnet format HVO.SkyMonitor.v9.slnx --no-restore --verify-no-changes
      - name: Lint GitHub Actions workflows
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          printf '%s  %s\n' '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757' /tmp/actionlint.tar.gz | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
      - name: Audit identity and security operations guidance
        run: |
          bash -n .devcontainer/*.sh .devcontainer/opencode-host.conf scripts/docs:audit-operations scripts/identity:smoke scripts/smoke:env scripts/user-secret:set scripts/infra:operation-lock scripts/infra:validate-app-state-archive scripts/infra:start scripts/infra:reset scripts/infra:backup-app-state scripts/infra:restore-app-state scripts/test:infra scripts/test:smoke-env scripts/test:opencode scripts/test:cameraagent-dual-197 scripts/ci:classify scripts/ci:require scripts/test:ci-classification scripts/catalog/*.sh scripts/catalog:install scripts/opencode:connect scripts/opencode:enable scripts/opencode:disable
          ./scripts/docs:audit-operations
          ./scripts/test:infra
          ./scripts/test:smoke-env
          bash ./scripts/test:opencode
          bash ./scripts/test:ci-classification
          ./scripts/catalog/smoke-test.sh
          SQLSERVER_PASSWORD=validation-only REDIS_PASSWORD=validation-only MINIO_ACCESS_KEY=validation-only MINIO_SECRET_KEY=validation-only CAMERA_AGENT_ADMIN_PASSWORD=validation-only-password CAMERA_AGENT_OAUTH_CLIENT_SECRET=validation-only-oauth-secret docker compose --env-file .env.template -f docker-compose.apps.yml config --quiet
          MINIO_ROOT_USER=validation-only MINIO_ROOT_PASSWORD=validation-only REDIS_PASSWORD=validation-only docker compose --env-file .env.template -f deploy/hvo-docker/docker-compose.shared-services.yml config --quiet
          docker compose --env-file deploy/acceptance/issue-197/compose.validation.env.template -f deploy/acceptance/issue-197/compose.yml config --quiet
      - name: Audit vulnerable and deprecated packages
        run: ./scripts/package:audit
      - name: Upload package audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-audit
          path: TestResults/package-audit/*.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore HVO.SkyMonitor.v9.slnx
      - name: Warning-clean Debug build
        run: dotnet build HVO.SkyMonitor.v9.slnx --no-restore --no-incremental --configuration Debug -warnaserror
      - name: Warning-clean Release build
        run: dotnet build HVO.SkyMonitor.v9.slnx --no-restore --no-incremental --configuration Release -warnaserror
      - name: Audit behavioral test categories
        run: dotnet run --project scripts/test-categories/HVO.SkyMonitor.TestCategoryAudit.csproj --configuration Release

  unit:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 20
    env:
      DOCKER_HOST: unix:///tmp/hvo-unit-docker-must-not-exist.sock
      UNIT_FILTER: TestCategory=Unit&TestCategory!=Integration&TestCategory!=Manual&TestCategory!=Soak&TestCategory!=External&TestCategory!=Hardware
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore and build Release
        run: |
          dotnet restore HVO.SkyMonitor.v9.slnx
          dotnet build HVO.SkyMonitor.v9.slnx --no-restore --configuration Release
      - name: Run Docker-disabled Unit suites
        run: |
          dotnet test tests/HVO.SkyMonitor.Astronomy.Tests/HVO.SkyMonitor.Astronomy.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/astronomy --logger "trx;LogFileName=unit-astronomy.trx"
          dotnet test tests/HVO.SkyMonitor.Imaging.Tests/HVO.SkyMonitor.Imaging.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/imaging --logger "trx;LogFileName=unit-imaging.trx"
          dotnet test tests/HVO.SkyMonitor.Processing.Tests/HVO.SkyMonitor.Processing.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/processing --logger "trx;LogFileName=unit-processing.trx"
          dotnet test tests/HVO.SkyMonitor.Catalog.Sqlite.Tests/HVO.SkyMonitor.Catalog.Sqlite.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/catalog-sqlite --logger "trx;LogFileName=unit-catalog-sqlite.trx"
          dotnet test tests/HVO.SkyMonitor.CameraAgent.Tests/HVO.SkyMonitor.CameraAgent.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/cameraagent --logger "trx;LogFileName=unit-cameraagent.trx"
          dotnet test tests/HVO.SkyMonitor.Tests/HVO.SkyMonitor.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/logichost --logger "trx;LogFileName=unit-logichost.trx"
      - name: Upload Unit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-evidence
          path: TestResults/unit/
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 35
    env:
      INTEGRATION_FILTER: TestCategory=Integration&TestCategory!=Soak&TestCategory!=Manual&TestCategory!=External&TestCategory!=Hardware
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore and build Release
        run: |
          dotnet restore HVO.SkyMonitor.v9.slnx
          dotnet build HVO.SkyMonitor.v9.slnx --no-restore --configuration Release
      - name: Run Integration suites
        run: |
          dotnet test tests/HVO.SkyMonitor.CameraAgent.Tests/HVO.SkyMonitor.CameraAgent.Tests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent-storage --logger "trx;LogFileName=integration-cameraagent-storage.trx"
          dotnet test tests/HVO.SkyMonitor.CameraAgent.AcceptanceTests/HVO.SkyMonitor.CameraAgent.AcceptanceTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent-standalone --logger "trx;LogFileName=integration-cameraagent-standalone.trx"
          dotnet test tests/HVO.SkyMonitor.IntegrationTests/HVO.SkyMonitor.IntegrationTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/logichost --logger "trx;LogFileName=integration-logichost.trx"
          dotnet test tests/HVO.SkyMonitor.CameraAgent.IntegrationTests/HVO.SkyMonitor.CameraAgent.IntegrationTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent-host --logger "trx;LogFileName=integration-cameraagent-host.trx"
      - name: Upload Integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-evidence
          path: TestResults/integration/
          if-no-files-found: error
          retention-days: 30

  architecture:
    name: Architecture & Publish
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore and build Release
        run: |
          dotnet restore HVO.SkyMonitor.v9.slnx
          dotnet build HVO.SkyMonitor.v9.slnx --no-restore --configuration Release
      - name: Validate architecture graph and publish outputs
        env:
          HVO_PUBLISH_EVIDENCE_ROOT: ${{ github.workspace }}/TestResults/publish
        run: |
          dotnet test tests/HVO.SkyMonitor.Tests/HVO.SkyMonitor.Tests.csproj --no-build --configuration Release --filter "TestCategory=Integration&FullyQualifiedName~ArchitectureBoundaryTests" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/architecture --logger "trx;LogFileName=architecture-publish.trx"
      - name: Create retained publish manifests
        run: |
          (cd TestResults/publish/cameraagent && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../cameraagent.sha256)
          (cd TestResults/publish/logichost && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../logichost.sha256)
          cameraagent_files=$(find TestResults/publish/cameraagent -type f | wc -l)
          cameraagent_bytes=$(find TestResults/publish/cameraagent -type f -printf '%s\n' | awk '{total += $1} END {print total}')
          cameraagent_dependencies=$(find TestResults/publish/cameraagent -maxdepth 1 -type f -name '*.dll' | wc -l)
          logichost_files=$(find TestResults/publish/logichost -type f | wc -l)
          logichost_bytes=$(find TestResults/publish/logichost -type f -printf '%s\n' | awk '{total += $1} END {print total}')
          logichost_dependencies=$(find TestResults/publish/logichost -maxdepth 1 -type f -name '*.dll' | wc -l)
          printf 'CameraAgent files=%s bytes=%s dependencies=%s\nLogicHost files=%s bytes=%s dependencies=%s\n' \
            "$cameraagent_files" "$cameraagent_bytes" "$cameraagent_dependencies" \
            "$logichost_files" "$logichost_bytes" "$logichost_dependencies" \
            > TestResults/publish/summary.txt
      - name: Upload architecture coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: architecture-test-evidence
          path: TestResults/architecture/
          if-no-files-found: error
          retention-days: 30
      - name: Upload publish evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-evidence
          path: |
            TestResults/publish/*.sha256
            TestResults/publish/summary.txt
          if-no-files-found: error
          retention-days: 30

  migrations:
    name: Migrations
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore tools and build Release
        run: |
          dotnet tool restore
          dotnet restore HVO.SkyMonitor.v9.slnx
          dotnet build HVO.SkyMonitor.v9.slnx --no-restore --configuration Release
      - name: Reject pending CameraAgent model changes
        run: dotnet ef migrations has-pending-model-changes --project src/HVO.SkyMonitor.CameraAgent/HVO.SkyMonitor.CameraAgent.csproj --startup-project src/HVO.SkyMonitor.CameraAgent/HVO.SkyMonitor.CameraAgent.csproj --context HVO.SkyMonitor.CameraAgent.Data.ApplicationDbContext --configuration Release --no-build
      - name: Reject pending LogicHost model changes
        env:
          ConnectionStrings__skymonitordb: Server=127.0.0.1,1433;Database=ModelCheck;User Id=sa;Password=Model_check1!;TrustServerCertificate=True
        run: dotnet ef migrations has-pending-model-changes --project src/HVO.SkyMonitor.LogicHost/HVO.SkyMonitor.LogicHost.csproj --startup-project src/HVO.SkyMonitor.LogicHost/HVO.SkyMonitor.LogicHost.csproj --context HVO.SkyMonitor.LogicHost.Data.ApplicationDbContext --configuration Release --no-build

  coverage:
    name: Coverage
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 10
    needs: [changes, unit, integration, architecture]
    if: needs.changes.outputs.mode == 'full'
    outputs:
      line: ${{ steps.coverage-metrics.outputs.line }}
      branch: ${{ steps.coverage-metrics.outputs.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore coverage tool
        run: dotnet tool restore
      - name: Download Unit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unit-test-evidence
          path: TestResults/unit
      - name: Download Integration evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: integration-test-evidence
          path: TestResults/integration
      - name: Download architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: architecture-test-evidence
          path: TestResults/architecture
      - name: Reject weakened coverage thresholds
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git cat-file -e "origin/$BASE_REF:scripts/coverage/baseline.json" 2>/dev/null; then
            git show "origin/$BASE_REF:scripts/coverage/baseline.json" > /tmp/base-coverage.json
            jq --exit-status --slurpfile base /tmp/base-coverage.json '
              . as $candidate |
              $candidate.aggregate.line >= $base[0].aggregate.line and
              $candidate.aggregate.branch >= $base[0].aggregate.branch and
              $candidate.aggregate.tolerancePercentagePoints <= $base[0].aggregate.tolerancePercentagePoints and
              all($base[0].files | to_entries[];
                $candidate.files[.key] != null and
                $candidate.files[.key].line >= .value.line and
                $candidate.files[.key].branch >= .value.branch)
            ' scripts/coverage/baseline.json
          fi
      - name: Enforce exact-path coverage baseline
        run: |
          patterns=(
            'TestResults/unit/astronomy/*/coverage.cobertura.xml'
            'TestResults/unit/imaging/*/coverage.cobertura.xml'
            'TestResults/unit/processing/*/coverage.cobertura.xml'
            'TestResults/unit/catalog-sqlite/*/coverage.cobertura.xml'
            'TestResults/unit/cameraagent/*/coverage.cobertura.xml'
            'TestResults/unit/logichost/*/coverage.cobertura.xml'
            'TestResults/integration/cameraagent-storage/*/coverage.cobertura.xml'
            'TestResults/integration/cameraagent-standalone/*/coverage.cobertura.xml'
            'TestResults/integration/logichost/*/coverage.cobertura.xml'
            'TestResults/integration/cameraagent-host/*/coverage.cobertura.xml'
            'TestResults/architecture/*/coverage.cobertura.xml'
          )
          reports=()
          for pattern in "${patterns[@]}"; do
            mapfile -t matches < <(compgen -G "$pattern" || true)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              printf 'Expected one coverage report for %s, found %s\n' "$pattern" "${#matches[@]}" >&2
              exit 1
            fi
            reports+=("${matches[0]}")
          done
          dotnet reportgenerator "-reports:$(IFS=';'; echo "${reports[*]}")" -targetdir:coverage-report -reporttypes:"Html;TextSummary;MarkdownSummaryGithub;Badges;Cobertura"
          ./scripts/coverage:enforce --merged coverage-report/Cobertura.xml
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Read coverage metrics
        if: success()
        id: coverage-metrics
        run: |
          line=$(awk '/Line coverage:/ {gsub("%", "", $3); print $3}' coverage-report/Summary.txt)
          branch=$(awk '/Branch coverage:/ {gsub("%", "", $3); print $3}' coverage-report/Summary.txt)
          printf 'line=%s\nbranch=%s\n' "$line" "$branch" >> "$GITHUB_OUTPUT"
      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: error
          retention-days: 30

  badges:
    name: Coverage Badges
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 5
    needs: coverage
    steps:
      - name: Update line coverage badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: coverage-line.json
          label: line coverage
          message: ${{ needs.coverage.outputs.line }}%
          valColorRange: ${{ needs.coverage.outputs.line }}
          minColorRange: 40
          maxColorRange: 80
      - name: Update branch coverage badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: coverage-branch.json
          label: branch coverage
          message: ${{ needs.coverage.outputs.branch }}%
          valColorRange: ${{ needs.coverage.outputs.branch }}
          minColorRange: 30
          maxColorRange: 70

  required:
    name: Required CI
    if: always()
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 5
    needs: [changes, quality, build, unit, integration, architecture, migrations, coverage]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Require every current-head gate
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFICATION: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          ARCHITECTURE: ${{ needs.architecture.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: ./scripts/ci:require "$MODE" "$EVENT_NAME" "$CLASSIFICATION" "$QUALITY" "$BUILD" "$UNIT" "$INTEGRATION" "$ARCHITECTURE" "$MIGRATIONS" "$COVERAGE"

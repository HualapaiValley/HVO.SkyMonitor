      UNIT_FILTER: TestCategory=Unit&TestCategory!=Integration&TestCategory!=Manual&TestCategory!=Soak&TestCategory!=External&TestCategory!=Hardware
      INTEGRATION_FILTER: TestCategory=Integration&TestCategory!=Soak&TestCategory!=Manual&TestCategory!=External&TestCategory!=Hardware
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore and build LogicHost project roots
        run: ./scripts/ci:component-build logichost
      - name: Run LogicHost Unit suites
        env:
          DOCKER_HOST: unix:///tmp/hvo-unit-docker-must-not-exist.sock
        run: |
          dotnet test tests/HVO.SkyMonitor.LogicHost.Tests/HVO.SkyMonitor.LogicHost.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/logichost --logger "trx;LogFileName=unit-logichost.trx"
      - name: Run LogicHost Integration suites
        run: |
          dotnet test tests/HVO.SkyMonitor.LogicHost.IntegrationTests/HVO.SkyMonitor.LogicHost.IntegrationTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/logichost --logger "trx;LogFileName=integration-logichost.trx"
      - name: Publish LogicHost outputs
        run: ./scripts/ci:component-publish logichost
      - name: Restore coverage tool
        run: dotnet tool restore
      - name: Enforce LogicHost component coverage
        run: ./scripts/coverage:component logichost
      - name: Upload LogicHost component evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: logichost-component-evidence
          path: |
            TestResults/unit/
            TestResults/integration/
            TestResults/publish/component/
            coverage-report/logichost/
          if-no-files-found: error
          retention-days: 30

  combined-integration:
    name: Combined Protocol & Integration
    needs: changes
    if: needs.changes.outputs.complete == 'false' && needs.changes.outputs.combined == 'true'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 45
    env:
      UNIT_FILTER: TestCategory=Unit&TestCategory!=Integration&TestCategory!=Manual&TestCategory!=Soak&TestCategory!=External&TestCategory!=Hardware
      INTEGRATION_FILTER: TestCategory=Integration&TestCategory!=Soak&TestCategory!=Manual&TestCategory!=External&TestCategory!=Hardware
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore and build combined project roots
        run: ./scripts/ci:component-build combined
      - name: Run combined protocol Unit suites
        env:
          DOCKER_HOST: unix:///tmp/hvo-unit-docker-must-not-exist.sock
        run: |
          dotnet test tests/HVO.SkyMonitor.CameraAgent.LogicHost.Tests/HVO.SkyMonitor.CameraAgent.LogicHost.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/cameraagent-logichost --logger "trx;LogFileName=unit-cameraagent-logichost.trx"
      - name: Run combined Integration suites
        run: |
          dotnet test tests/HVO.SkyMonitor.CameraAgent.LogicHost.IntegrationTests/HVO.SkyMonitor.CameraAgent.LogicHost.IntegrationTests.csproj --no-build --configuration Release --filter "$INTEGRATION_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/integration/cameraagent-logichost --logger "trx;LogFileName=integration-cameraagent-logichost.trx"
      - name: Restore coverage tool
        run: dotnet tool restore
      - name: Enforce combined component coverage
        run: ./scripts/coverage:component combined
      - name: Upload combined component evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: combined-component-evidence
          path: |
            TestResults/unit/
            TestResults/integration/
            coverage-report/combined/
          if-no-files-found: error
          retention-days: 30

  delivery-component:
    name: Delivery Component
    needs: [changes, catalog-contracts]
    if: needs.changes.outputs.complete == 'false' && needs.changes.outputs.delivery == 'true'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 30
    env:
      UNIT_FILTER: TestCategory=Unit&TestCategory!=Integration&TestCategory!=Manual&TestCategory!=Soak&TestCategory!=External&TestCategory!=Hardware
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact production catalog contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hyg-v42-contracts
          path: ${{ runner.temp }}/hyg-v42-contract-artifact
      - name: Restore exact production catalog contract
        run: |
          catalog_root="$RUNNER_TEMP/hyg-v42-contracts"
          mkdir -m 700 "$catalog_root"
          tar -xzf "$RUNNER_TEMP/hyg-v42-contract-artifact/hyg-v42-contracts.tar.gz" -C "$catalog_root"
          bundle_path="$catalog_root/build/hyg-v4.2-p3-s2-r1.bundle"
          # The Deployment.Cli installer and lifecycle contracts skip themselves with
          # Assert.Inconclusive when this bundle is absent, and a skipped MSTest records
          # notExecuted="0" and inconclusive="0" in its TRX, so the job stays green having
          # executed none of them. Fail here, where the cause is visible, rather than let a
          # broken artifact restore turn into a green run that proved nothing.
          test -d "$bundle_path" ||
            { printf 'Catalog bundle missing after restore: %s\n' "$bundle_path" >&2; exit 1; }
          printf 'HVO_PRODUCTION_CATALOG_BUNDLE=%s\n' "$bundle_path" >> "$GITHUB_ENV"
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore and build delivery project roots
        run: ./scripts/ci:component-build delivery
      - name: Run delivery Unit suites
        env:
          DOCKER_HOST: unix:///tmp/hvo-unit-docker-must-not-exist.sock
        run: |
          dotnet test tests/HVO.SkyMonitor.Deployment.Cli.Tests/HVO.SkyMonitor.Deployment.Cli.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/deployment-cli --logger "trx;LogFileName=unit-deployment-cli.trx"
          dotnet test tests/HVO.SkyMonitor.Deployment.Distribution.Tests/HVO.SkyMonitor.Deployment.Distribution.Tests.csproj --no-build --configuration Release --filter "$UNIT_FILTER" --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults/unit/deployment-distribution --logger "trx;LogFileName=unit-deployment-distribution.trx"
      - name: Publish delivery outputs
        run: ./scripts/ci:component-publish delivery
      - name: Restore coverage tool
        run: dotnet tool restore
      - name: Enforce delivery component coverage
        run: ./scripts/coverage:component delivery
      - name: Upload delivery component evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: delivery-component-evidence
          path: |
            TestResults/unit/
            TestResults/publish/component/
            coverage-report/delivery/
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: Coverage
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 10
    needs: [changes, unit, integration, architecture]
    if: needs.changes.outputs.complete == 'true'
    outputs:
      line: ${{ steps.coverage-metrics.outputs.line }}
      branch: ${{ steps.coverage-metrics.outputs.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore coverage tool
        run: dotnet tool restore
      - name: Download Unit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unit-test-evidence
          path: TestResults/unit
      - name: Download Integration evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: integration-test-evidence
          path: TestResults/integration
      - name: Download architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: architecture-test-evidence
          path: TestResults/architecture
      - name: Enforce exact-path coverage baseline
        run: |
          patterns=(
            'TestResults/unit/astronomy/*/coverage.cobertura.xml'
            'TestResults/unit/imaging/*/coverage.cobertura.xml'
            'TestResults/unit/processing/*/coverage.cobertura.xml'
            'TestResults/unit/catalog-sqlite/*/coverage.cobertura.xml'
            'TestResults/unit/storage-filesystem/*/coverage.cobertura.xml'
            'TestResults/unit/deployment-cli/*/coverage.cobertura.xml'
            'TestResults/unit/deployment-distribution/*/coverage.cobertura.xml'
            'TestResults/unit/agent-core/*/coverage.cobertura.xml'
            'TestResults/unit/common/*/coverage.cobertura.xml'
            'TestResults/unit/fleet-contracts/*/coverage.cobertura.xml'
            'TestResults/unit/test-support/*/coverage.cobertura.xml'
            'TestResults/unit/architecture/*/coverage.cobertura.xml'
            'TestResults/unit/cameraagent/*/coverage.cobertura.xml'
            'TestResults/unit/cameraagent-acceptance/*/coverage.cobertura.xml'
            'TestResults/unit/logichost/*/coverage.cobertura.xml'
            'TestResults/unit/cameraagent-logichost/*/coverage.cobertura.xml'
            'TestResults/integration/cameraagent-storage/*/coverage.cobertura.xml'
            'TestResults/integration/cameraagent-standalone/*/coverage.cobertura.xml'
            'TestResults/integration/astronomy/*/coverage.cobertura.xml'
            'TestResults/integration/logichost/*/coverage.cobertura.xml'
            'TestResults/integration/cameraagent/*/coverage.cobertura.xml'
            'TestResults/integration/cameraagent-logichost/*/coverage.cobertura.xml'
            'TestResults/architecture/*/coverage.cobertura.xml'
          )
          reports=()
          for pattern in "${patterns[@]}"; do
            mapfile -t matches < <(compgen -G "$pattern" || true)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              printf 'Expected one coverage report for %s, found %s\n' "$pattern" "${#matches[@]}" >&2
              exit 1
            fi
            reports+=("${matches[0]}")
          done
          dotnet reportgenerator "-reports:$(IFS=';'; echo "${reports[*]}")" -targetdir:coverage-report -reporttypes:"Html;TextSummary;MarkdownSummaryGithub;Badges;Cobertura"
          ./scripts/coverage:enforce --merged coverage-report/Cobertura.xml
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Read coverage metrics
        if: success()
        id: coverage-metrics
        run: |
          line=$(awk '/Line coverage:/ {gsub("%", "", $3); print $3}' coverage-report/Summary.txt)
          branch=$(awk '/Branch coverage:/ {gsub("%", "", $3); print $3}' coverage-report/Summary.txt)
          printf 'line=%s\nbranch=%s\n' "$line" "$branch" >> "$GITHUB_OUTPUT"
      - name: Bind coverage evidence
        if: always()
        run: ./scripts/ci:artifact-provenance coverage-report coverage coverage-report
      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: error
          retention-days: 30

  badges:
    name: Coverage Badges
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, hvo-skymonitor]
    timeout-minutes: 5
    needs: coverage
    permissions: {}
    env:
      BADGE_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      BADGE_GIST_ID: ${{ vars.COVERAGE_GIST_ID }}
    steps:
      - name: Report unconfigured coverage badge publication
        if: env.BADGE_GIST_TOKEN == '' || env.BADGE_GIST_ID == ''
        run: |
          echo '::warning title=Coverage badge publication disabled::Configure GIST_TOKEN and COVERAGE_GIST_ID as documented in docs/runbooks/ci-pipeline.md.'
          printf '### Coverage badge publication\n\nSkipped because the repository credential or Gist ID is not configured.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish coverage badges
        id: publish_badges
        if: env.BADGE_GIST_TOKEN != '' && env.BADGE_GIST_ID != ''
        continue-on-error: true
        env:
          LINE_COVERAGE: ${{ needs.coverage.outputs.line }}
          BRANCH_COVERAGE: ${{ needs.coverage.outputs.branch }}
        run: |
          set -euo pipefail

          if [[ ! "$LINE_COVERAGE" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
             [[ ! "$BRANCH_COVERAGE" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
             ! awk -v line="$LINE_COVERAGE" -v branch="$BRANCH_COVERAGE" \
               'BEGIN { exit !(line <= 100 && branch <= 100) }'; then
            printf 'Coverage outputs must be numbers from 0 through 100.\n' >&2
            exit 1
          fi

          color_for() {
            awk -v value="$1" -v minimum="$2" -v maximum="$3" 'BEGIN {
              ratio = (value - minimum) / (maximum - minimum)
              if (ratio < 0) ratio = 0
              if (ratio > 1) ratio = 1
              printf "%02x%02x00", 255 * (1 - ratio), 200 * ratio
            }'
          }

          line_color="$(color_for "$LINE_COVERAGE" 40 80)"
          branch_color="$(color_for "$BRANCH_COVERAGE" 30 70)"
          badge_payload="$RUNNER_TEMP/coverage-badges-${GITHUB_RUN_ID}.json"
          badge_response="$RUNNER_TEMP/coverage-badges-response-${GITHUB_RUN_ID}.json"

          line_badge="$(jq --compact-output --null-input \
            --arg message "${LINE_COVERAGE}%" \
            --arg color "$line_color" \
            '{schemaVersion: 1, label: "line coverage", message: $message, color: $color}')"
          branch_badge="$(jq --compact-output --null-input \
            --arg message "${BRANCH_COVERAGE}%" \
            --arg color "$branch_color" \
            '{schemaVersion: 1, label: "branch coverage", message: $message, color: $color}')"
          jq --null-input \
            --arg line "$line_badge" \
            --arg branch "$branch_badge" \
            '{files: {
              "coverage-line.json": {content: $line},
              "coverage-branch.json": {content: $branch}
            }}' > "$badge_payload"

          # Feed the credential through curl's standard-input configuration so
          # it never appears in the process argument list on the shared runner.
          {
            printf 'header = "Authorization: Bearer %s"\n' "$BADGE_GIST_TOKEN"
            printf '%s\n' 'header = "Accept: application/vnd.github+json"'
            printf '%s\n' 'header = "X-GitHub-Api-Version: 2022-11-28"'
            printf '%s\n' 'header = "Content-Type: application/json"'
          } | curl --disable --config - \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 45 \
            --retry 2 \
            --retry-all-errors \
            --retry-max-time 120 \
            --request PATCH \
            --data-binary @"$badge_payload" \
            --output "$badge_response" \
            "https://api.github.com/gists/$BADGE_GIST_ID"

          jq --exit-status \
            --argjson line "$line_badge" \
            --argjson branch "$branch_badge" \
            '(.files["coverage-line.json"].content | fromjson) == $line and
             (.files["coverage-branch.json"].content | fromjson) == $branch' \
            "$badge_response" > /dev/null
      - name: Report coverage badge publication failure
        if: always() && env.BADGE_GIST_TOKEN != '' && env.BADGE_GIST_ID != '' && steps.publish_badges.outcome == 'failure'
        run: |
          echo '::warning title=Coverage badge publication failed::Required CI remains authoritative; rotate GIST_TOKEN or inspect the coverage Gist before relying on the badges.'
          printf '### Coverage badge publication\n\nPublication failed. Required CI remains authoritative until the badge credential or Gist is repaired.\n' >> "$GITHUB_STEP_SUMMARY"

  required:
    name: Required CI
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, quality, catalog-contracts, deployment-contracts, build, architecture, coverage-policy, migrations-cameraagent, migrations-logichost, unit, integration, coverage, shared-libraries, cameraagent-component, logichost-component, combined-integration, delivery-component]
    steps:
      - name: Block merge while review is in progress
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          echo 'Required CI is intentionally blocked while the pull request is draft.' >&2
          exit 1
      - name: Checkout
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every current-head gate
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN: >-
            mode=${{ needs.changes.outputs.mode }}
            complete=${{ needs.changes.outputs.complete }}
            shared=${{ needs.changes.outputs.shared }}
            cameraagent=${{ needs.changes.outputs.cameraagent }}
            logichost=${{ needs.changes.outputs.logichost }}
            combined=${{ needs.changes.outputs.combined }}
            delivery=${{ needs.changes.outputs.delivery }}
            deployment=${{ needs.changes.outputs.deployment }}
          RESULTS: >-
            changes=${{ needs.changes.result }}
            quality=${{ needs.quality.result }}
            catalog-contracts=${{ needs.catalog-contracts.result }}
            deployment-contracts=${{ needs.deployment-contracts.result }}
            build=${{ needs.build.result }}
            architecture=${{ needs.architecture.result }}
            coverage-policy=${{ needs.coverage-policy.result }}
            migrations-cameraagent=${{ needs.migrations-cameraagent.result }}
            migrations-logichost=${{ needs.migrations-logichost.result }}
            unit=${{ needs.unit.result }}
            integration=${{ needs.integration.result }}
            coverage=${{ needs.coverage.result }}
            shared-libraries=${{ needs.shared-libraries.result }}
            cameraagent-component=${{ needs.cameraagent-component.result }}
            logichost-component=${{ needs.logichost-component.result }}
            combined-integration=${{ needs.combined-integration.result }}
            delivery-component=${{ needs.delivery-component.result }}
        run: ./scripts/ci:require "$EVENT_NAME" "$PLAN" "$RESULTS"

name: M5 Mac Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-mac-validation
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  validate:
    name: Apple ARM64 Validation
    runs-on: [self-hosted, macOS, ARM64, m5-mac]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify Apple ARM64 toolchain
        run: |
          test "$(uname -m)" = arm64
          test "$(dotnet --version)" = "$(jq -r '.sdk.version' global.json)"
          sw_vers
          xcodebuild -version
          swift --version
          dotnet --version

      - name: Restore dependencies
        run: dotnet restore HVO.SkyMonitor.v9.slnx

      - name: Build with warnings as errors
        run: dotnet build HVO.SkyMonitor.v9.slnx --no-restore --configuration Release -warnaserror

      - name: Run host-neutral unit suites
        env:
          DOCKER_HOST: unix://${{ runner.temp }}/hvo-no-docker.sock
          TMPDIR: ${{ runner.temp }}/hvo-m5-validation
        run: |
          mkdir -p "$TMPDIR"
          projects=(
            tests/HVO.SkyMonitor.AgentCore.Tests/HVO.SkyMonitor.AgentCore.Tests.csproj
            tests/HVO.SkyMonitor.CameraAgent.AcceptanceTests/HVO.SkyMonitor.CameraAgent.AcceptanceTests.csproj
            tests/HVO.SkyMonitor.Fleet.Contracts.Tests/HVO.SkyMonitor.Fleet.Contracts.Tests.csproj
            tests/HVO.SkyMonitor.Catalog.Sqlite.Tests/HVO.SkyMonitor.Catalog.Sqlite.Tests.csproj
            tests/HVO.SkyMonitor.CameraAgent.LogicHost.Tests/HVO.SkyMonitor.CameraAgent.LogicHost.Tests.csproj
            tests/HVO.SkyMonitor.Imaging.Tests/HVO.SkyMonitor.Imaging.Tests.csproj
            tests/HVO.SkyMonitor.TestSupport.Tests/HVO.SkyMonitor.TestSupport.Tests.csproj
            tests/HVO.SkyMonitor.Deployment.Distribution.Tests/HVO.SkyMonitor.Deployment.Distribution.Tests.csproj
            tests/HVO.SkyMonitor.Processing.Tests/HVO.SkyMonitor.Processing.Tests.csproj
            tests/HVO.SkyMonitor.ProcessingRunner.Tests/HVO.SkyMonitor.ProcessingRunner.Tests.csproj
            tests/HVO.SkyMonitor.Common.Tests/HVO.SkyMonitor.Common.Tests.csproj
            tests/HVO.SkyMonitor.Architecture.Tests/HVO.SkyMonitor.Architecture.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet test "$project" \
              --no-build \
              --configuration Release \
              --filter "TestCategory=Unit"
          done

name: M5 Mac Validation

on:
  repository_dispatch:
    types: [m5-mac-validation]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit SHA to validate (defaults to the workflow commit)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: m5-mac-validation
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  validate:
    name: Apple ARM64 Validation
    runs-on: [self-hosted, macOS, ARM64, m5-mac]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify Apple ARM64 toolchain
        run: |
          test "$(uname -m)" = arm64
          test "$(dotnet --version)" = "$(jq -r '.sdk.version' global.json)"
          sw_vers
          xcodebuild -version
          swift --version
          dotnet --version

      - name: Restore dependencies
        run: dotnet restore HVO.SkyMonitor.v9.slnx

      - name: Build with warnings as errors
        run: dotnet build HVO.SkyMonitor.v9.slnx --no-restore --configuration Release -warnaserror

      - name: Run host-neutral unit suites
        run: |
          results_root="$RUNNER_TEMP/hvo-m5-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$results_root"
          mkdir -m 700 "$results_root"
          export DOCKER_HOST="unix://$results_root/hvo-no-docker.sock"
          export TMPDIR="$results_root/tmp"
          mkdir -m 700 "$TMPDIR"

          # Expected Unit totals come from the category audit matrix rather than from pins kept here.
          # This workflow is dispatch-only, so nothing surfaces a stale pin until someone dispatches
          # it, and a repository-wide compile item that adds methods to every test project breaks
          # every pin at once with no protected-CI signal (#764). The audit validates that matrix
          # against a real per-project discovery run on every full CI run, so reading it here means
          # the two count sources cannot drift apart again.
          matrix="$results_root/category-matrix.tsv"
          dotnet run --project scripts/test-categories/HVO.SkyMonitor.TestCategoryAudit.csproj \
            --configuration Release -- --emit-matrix > "$matrix"
          test -s "$matrix"

          # Only the skipped count stays pinned. It is a property of this host rather than of the
          # sources -- these are the macOS-gated and environment-gated cases -- so it cannot be
          # derived from a discovery matrix, and the executed count follows from the other two.
          projects=(
            "agent-core|0|tests/HVO.SkyMonitor.AgentCore.Tests/HVO.SkyMonitor.AgentCore.Tests.csproj"
            "cameraagent-acceptance|0|tests/HVO.SkyMonitor.CameraAgent.AcceptanceTests/HVO.SkyMonitor.CameraAgent.AcceptanceTests.csproj"
            "fleet-contracts|0|tests/HVO.SkyMonitor.Fleet.Contracts.Tests/HVO.SkyMonitor.Fleet.Contracts.Tests.csproj"
            "catalog-sqlite|1|tests/HVO.SkyMonitor.Catalog.Sqlite.Tests/HVO.SkyMonitor.Catalog.Sqlite.Tests.csproj"
            "cameraagent-logichost|0|tests/HVO.SkyMonitor.CameraAgent.LogicHost.Tests/HVO.SkyMonitor.CameraAgent.LogicHost.Tests.csproj"
            "astronomy|0|tests/HVO.SkyMonitor.Astronomy.Tests/HVO.SkyMonitor.Astronomy.Tests.csproj"
            "cameraagent|49|tests/HVO.SkyMonitor.CameraAgent.Tests/HVO.SkyMonitor.CameraAgent.Tests.csproj"
            "imaging|0|tests/HVO.SkyMonitor.Imaging.Tests/HVO.SkyMonitor.Imaging.Tests.csproj"
            "test-support|0|tests/HVO.SkyMonitor.TestSupport.Tests/HVO.SkyMonitor.TestSupport.Tests.csproj"
            "deployment-distribution|0|tests/HVO.SkyMonitor.Deployment.Distribution.Tests/HVO.SkyMonitor.Deployment.Distribution.Tests.csproj"
            "processing|0|tests/HVO.SkyMonitor.Processing.Tests/HVO.SkyMonitor.Processing.Tests.csproj"
            "processing-runner|0|tests/HVO.SkyMonitor.ProcessingRunner.Tests/HVO.SkyMonitor.ProcessingRunner.Tests.csproj"
            "common|0|tests/HVO.SkyMonitor.Common.Tests/HVO.SkyMonitor.Common.Tests.csproj"
            "architecture|0|tests/HVO.SkyMonitor.Architecture.Tests/HVO.SkyMonitor.Architecture.Tests.csproj"
            "deployment-cli|134|tests/HVO.SkyMonitor.Deployment.Cli.Tests/HVO.SkyMonitor.Deployment.Cli.Tests.csproj"
          )
          test "${#projects[@]}" -eq 15

          aggregate_total=0
          aggregate_executed=0
          aggregate_skipped=0
          expected_aggregate_total=0
          expected_aggregate_skipped=0
          for entry in "${projects[@]}"; do
            IFS='|' read -r name expected_skipped project <<< "$entry"
            expected_total="$(awk -F'\t' -v p="$project" '$1 == "Unit" && $2 == p { print $3 }' "$matrix")"
            # An empty lookup would make every comparison below compare against nothing, which is
            # the failure this change exists to remove rather than reintroduce one level in.
            case "$expected_total" in
              ''|*[!0-9]*) printf 'No Unit total in the category matrix for %s\n' "$project" >&2; exit 1 ;;
            esac
            expected_executed=$((expected_total - expected_skipped))
            expected_aggregate_total=$((expected_aggregate_total + expected_total))
            expected_aggregate_skipped=$((expected_aggregate_skipped + expected_skipped))
            project_results="$results_root/$name"
            mkdir -m 700 "$project_results"
            dotnet test "$project" \
              --no-build \
              --configuration Release \
              --filter "TestCategory=Unit" \
              --results-directory "$project_results" \
              --logger "trx;LogFileName=$name.trx"

            trx="$project_results/$name.trx"
            test -f "$trx"
            outcome="$(xmllint --nonet --xpath 'string(/*[local-name()="TestRun"]/*[local-name()="ResultSummary"]/@outcome)' "$trx")"
            total="$(xmllint --nonet --xpath 'string(/*[local-name()="TestRun"]/*[local-name()="ResultSummary"]/*[local-name()="Counters"]/@total)' "$trx")"
            executed="$(xmllint --nonet --xpath 'string(/*[local-name()="TestRun"]/*[local-name()="ResultSummary"]/*[local-name()="Counters"]/@executed)' "$trx")"
            skipped=$((total - executed))
            failed="$(xmllint --nonet --xpath 'string(/*[local-name()="TestRun"]/*[local-name()="ResultSummary"]/*[local-name()="Counters"]/@failed)' "$trx")"
            error="$(xmllint --nonet --xpath 'string(/*[local-name()="TestRun"]/*[local-name()="ResultSummary"]/*[local-name()="Counters"]/@error)' "$trx")"
            timeout="$(xmllint --nonet --xpath 'string(/*[local-name()="TestRun"]/*[local-name()="ResultSummary"]/*[local-name()="Counters"]/@timeout)' "$trx")"
            aborted="$(xmllint --nonet --xpath 'string(/*[local-name()="TestRun"]/*[local-name()="ResultSummary"]/*[local-name()="Counters"]/@aborted)' "$trx")"

            test "$outcome" = Completed
            test "$total" -eq "$expected_total"
            test "$executed" -eq "$expected_executed"
            test "$skipped" -eq "$expected_skipped"
            test "$total" -gt 0
            test "$executed" -gt 0
            test "$failed" -eq 0
            test "$error" -eq 0
            test "$timeout" -eq 0
            test "$aborted" -eq 0

            aggregate_total=$((aggregate_total + total))
            aggregate_executed=$((aggregate_executed + executed))
            aggregate_skipped=$((aggregate_skipped + skipped))
            printf '%s: discovered=%s executed=%s skipped=%s\n' "$name" "$total" "$executed" "$skipped"
          done

          # Accumulated from the same per-project numbers, so these guard the loop -- that every
          # entry ran and contributed -- rather than restating the pins a second time in a form
          # that can go stale independently, which is what #764 was.
          test "$aggregate_total" -eq "$expected_aggregate_total"
          test "$aggregate_executed" -eq $((expected_aggregate_total - expected_aggregate_skipped))
          test "$aggregate_skipped" -eq "$expected_aggregate_skipped"
          test "$aggregate_total" -gt 0
          printf 'aggregate: discovered=%s executed=%s skipped=%s\n' \
            "$aggregate_total" "$aggregate_executed" "$aggregate_skipped"

# Application services for HVO.SkyMonitor. Shared dependencies run on hvo-docker.

services:
  logichost:
    build:
      context: .
      dockerfile: src/HVO.SkyMonitor.LogicHost/Dockerfile
    container_name: skymonitor-logichost
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      HOME: /home/app
      OTEL_SERVICE_NAME: hvo-skymonitor
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT must be set}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:?OTEL_EXPORTER_OTLP_PROTOCOL must be set}
      ConnectionStrings__skymonitordb: "Server=${SQLSERVER_HOST:?SQLSERVER_HOST must be set},${SQLSERVER_PORT:?SQLSERVER_PORT must be set};Database=${SQLSERVER_DATABASE:?SQLSERVER_DATABASE must be set};User Id=${SQLSERVER_USER:?SQLSERVER_USER must be set};Password=${SQLSERVER_PASSWORD:?SQLSERVER_PASSWORD must be set};TrustServerCertificate=True"
      Redis__Configuration: "${REDIS_HOST:?REDIS_HOST must be set}:${REDIS_PORT:?REDIS_PORT must be set},user=${REDIS_USER:-skymonitor-app},password=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      Redis__InstanceName: "skymonitor:"
      Minio__Endpoint: "${MINIO_HOST:?MINIO_HOST must be set}"
      Minio__Port: ${MINIO_API_PORT:?MINIO_API_PORT must be set}
      Minio__AccessKey: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      Minio__SecretKey: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      Minio__DefaultBucket: skymonitor-diagnostics
      Minio__UseSsl: "false"
      Smtp__Host: ${SMTP_HOST:?SMTP_HOST must be set}
      Smtp__Port: ${SMTP_PORT:?SMTP_PORT must be set}
      Smtp__From: ${SMTP_FROM:-no-reply@skymonitor.local}
      DeviceBootstrap__CentralIdentity__ServiceUrl: ${CAMERA_AGENT_LOGIC_BASEURL:-http://logichost:8080}
      DeviceBootstrap__CentralIdentity__Mode: ClientCredentials
      DeviceBootstrap__CentralIdentity__ClientCredentials__ClientId: ${CAMERA_AGENT_OAUTH_CLIENT_ID:-system-camera-agent}
      DeviceBootstrap__CentralIdentity__ClientCredentials__ClientSecret: ${CAMERA_AGENT_OAUTH_CLIENT_SECRET:?CAMERA_AGENT_OAUTH_CLIENT_SECRET must be set}
      DeviceBootstrap__CentralIdentity__ClientCredentials__Scopes__0: api.camera
      DeviceBootstrap__CentralIdentity__ClientCredentials__Scopes__1: api.frames
      DeviceBootstrap__CentralIdentity__ClientCredentials__Scopes__2: api.images
      Catalog__Root: /app/catalog
      Catalog__RequiredCatalogId: hyg-v42-production
      Catalog__RequiredPackageKind: Production
    ports:
      - "${LOGIC_HOST_HTTP_PORT:-5174}:8080"
    volumes:
      - type: bind
        source: ${HVO_RUNTIME_DATA_ROOT:-./data}/logichost/dataprotection
        target: /app/DataProtection-Keys
      - type: bind
        source: ${HVO_RUNTIME_DATA_ROOT:-./data}/logichost/home
        target: /home/app
      - type: bind
        source: ${HVO_RUNTIME_DATA_ROOT:-./data}/catalog
        target: /app/catalog
        read_only: true
    restart: unless-stopped
    networks:
      - skymonitor-network

  cameraagent:
    build:
      context: .
      dockerfile: src/HVO.SkyMonitor.CameraAgent/Dockerfile
    container_name: skymonitor-cameraagent
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_SERVICE_NAME: hvo-camera
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT must be set}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:?OTEL_EXPORTER_OTLP_PROTOCOL must be set}
      SkyMonitor__BaseUrl: ${CAMERA_AGENT_LOGIC_BASEURL:-http://logichost:8080}
      SkyMonitor__PublicBaseUrl: ${CAMERA_AGENT_PUBLIC_LOGIC_BASEURL:-http://localhost:5174}
      CentralIdentity__ServiceUrl: ${CAMERA_AGENT_IDENTITY_URL:-http://logichost:8080}
      CentralIdentity__InteractiveClient__PublicAuthority: ${CAMERA_AGENT_IDENTITY_PUBLIC_URL:-http://localhost:5174}
      LocalIdentity__DatabasePath: ${CAMERA_AGENT_IDENTITY_DB_PATH:-/app/App_Data/identity/cameraagent_identity.db}
      LocalIdentity__AdminEmail: ${CAMERA_AGENT_ADMIN_EMAIL:-owner@cameraagent.local}
      LocalIdentity__AdminPassword: ${CAMERA_AGENT_ADMIN_PASSWORD:?CAMERA_AGENT_ADMIN_PASSWORD must be set}
      DeviceProvisioning__StateDirectory: /app/data/provisioning
      CameraAgent__RawIngressRoot: /workspaces/HVO.SkyMonitor/data/agent
      Catalog__Root: /app/catalog
      Catalog__RequiredCatalogId: hyg-v42-production
      Catalog__RequiredPackageKind: Production
    ports:
      - "${CAMERA_AGENT_HTTP_PORT:-5130}:8080"
    volumes:
      - type: bind
        source: ${HVO_RUNTIME_DATA_ROOT:-./data}/cameraagent/identity
        target: /app/App_Data/identity
      - type: bind
        source: ${HVO_RUNTIME_DATA_ROOT:-./data}/cameraagent/dataprotection
        target: /app/DataProtection-Keys
      - type: bind
        source: ${HVO_RUNTIME_DATA_ROOT:-./data}/cameraagent/provisioning
        target: /app/data/provisioning
      - type: bind
        source: ${HVO_RUNTIME_DATA_ROOT:-./data}/agent
        target: /workspaces/HVO.SkyMonitor/data/agent
      - type: bind
        source: ${HVO_RUNTIME_DATA_ROOT:-./data}/archive
        target: /workspaces/HVO.SkyMonitor/data/archive
      - type: bind
        source: ${HVO_RUNTIME_DATA_ROOT:-./data}/catalog
        target: /app/catalog
        read_only: true
    restart: unless-stopped
    stop_grace_period: 45s
    networks:
      - skymonitor-network

networks:
  skymonitor-network:
    name: skymonitor-network
    driver: bridge

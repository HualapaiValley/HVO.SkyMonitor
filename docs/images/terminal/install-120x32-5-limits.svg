<text x="20.40" y="55.50" fill="#ffffff" textLength="201.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">HVO SKYMONITOR INSTALLER</text>
<text x="919.20" y="55.50" fill="#3b8eea" textLength="92.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">STEP 5 OF 7</text>
<text x="20.40" y="73.50" fill="#e5e5e5" textLength="520.80" lengthAdjust="spacingAndGlyphs">hvo-sky-install 0.9.0-dev installs CameraAgent on this machine</text>
<text x="768.00" y="73.50" fill="#e5e5e5" textLength="243.60" lengthAdjust="spacingAndGlyphs">Nothing changes until Install</text>
<text x="45.60" y="109.50" fill="#3b8eea" textLength="134.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">CONTAINER LIMITS</text>
<text x="700.80" y="109.50" fill="#3b8eea" textLength="58.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">ANSWERS</text>
<text x="37.20" y="127.50" fill="#e5e5e5" textLength="613.20" lengthAdjust="spacingAndGlyphs">CameraAgent's container limits. Leave one empty for the default, at least</text>
<text x="692.40" y="127.50" fill="#ffffff" textLength="50.40" lengthAdjust="spacingAndGlyphs">Camera</text>
<text x="793.20" y="127.50" fill="#ffffff" textLength="92.40" lengthAdjust="spacingAndGlyphs">Allsky East</text>
<text x="37.20" y="145.50" fill="#e5e5e5" textLength="336.00" lengthAdjust="spacingAndGlyphs">2 CPUs and 4 GiB, which upgrades follow.</text>
<text x="692.40" y="145.50" fill="#ffffff" textLength="58.80" lengthAdjust="spacingAndGlyphs">Release</text>
<text x="793.20" y="145.50" fill="#ffffff" textLength="201.60" lengthAdjust="spacingAndGlyphs">/home/operator/hvo-sky-0</text>
<text x="793.20" y="163.50" fill="#ffffff" textLength="33.60" lengthAdjust="spacingAndGlyphs">.9.0</text>
<text x="37.20" y="181.50" fill="#3b8eea" textLength="33.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">CPUs</text>
<text x="692.40" y="181.50" fill="#ffffff" textLength="84.00" lengthAdjust="spacingAndGlyphs">Image from</text>
<text x="793.20" y="181.50" fill="#ffffff" textLength="92.40" lengthAdjust="spacingAndGlyphs">the archive</text>
<text x="188.40" y="199.50" fill="#e5e5e5" textLength="302.40" lengthAdjust="spacingAndGlyphs">empty for 2; at least 2, such as 2.5</text>
<text x="692.40" y="199.50" fill="#ffffff" textLength="58.80" lengthAdjust="spacingAndGlyphs">Catalog</text>
<text x="793.20" y="199.50" fill="#ffffff" textLength="201.60" lengthAdjust="spacingAndGlyphs">/home/operator/.cache/hv</text>
<text x="37.20" y="217.50" fill="#e5e5e5" textLength="50.40" lengthAdjust="spacingAndGlyphs">Memory</text>
<text x="793.20" y="217.50" fill="#ffffff" textLength="201.60" lengthAdjust="spacingAndGlyphs">o-sky/hyg-v4.4-p4-s3-r1.</text>
<text x="188.40" y="235.50" fill="#e5e5e5" textLength="386.40" lengthAdjust="spacingAndGlyphs">empty for 4g; at least 4g, such as 6g or 6144m</text>
<text x="793.20" y="235.50" fill="#ffffff" textLength="50.40" lengthAdjust="spacingAndGlyphs">bundle</text>
<text x="692.40" y="253.50" fill="#ffffff" textLength="58.80" lengthAdjust="spacingAndGlyphs">Address</text>
<text x="793.20" y="253.50" fill="#ffffff" textLength="117.60" lengthAdjust="spacingAndGlyphs">127.0.0.1:5130</text>
<text x="692.40" y="271.50" fill="#ffffff" textLength="67.20" lengthAdjust="spacingAndGlyphs">Location</text>
<text x="793.20" y="271.50" fill="#ffffff" textLength="75.60" lengthAdjust="spacingAndGlyphs">0, 0, 0 m</text>
<text x="37.20" y="289.50" fill="#e5e5e5" textLength="92.40" lengthAdjust="spacingAndGlyphs">Replays run</text>
<text x="188.40" y="289.50" fill="#ffffff" textLength="268.80" lengthAdjust="spacingAndGlyphs">(*) in CameraAgent's own process</text>
<text x="692.40" y="289.50" fill="#ffffff" textLength="75.60" lengthAdjust="spacingAndGlyphs">Time zone</text>
<text x="793.20" y="289.50" fill="#ffffff" textLength="25.20" lengthAdjust="spacingAndGlyphs">UTC</text>
<text x="188.40" y="307.50" fill="#ffffff" textLength="252.00" lengthAdjust="spacingAndGlyphs">( ) in a separate local runner</text>
<text x="692.40" y="307.50" fill="#ffffff" textLength="33.60" lengthAdjust="spacingAndGlyphs">CPUs</text>
<text x="793.20" y="307.50" fill="#ffffff" textLength="58.80" lengthAdjust="spacingAndGlyphs">default</text>
<text x="692.40" y="325.50" fill="#ffffff" textLength="50.40" lengthAdjust="spacingAndGlyphs">Memory</text>

<text x="20.40" y="55.50" fill="#f7f9fc" textLength="201.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">HVO SKYMONITOR INSTALLER</text>
<text x="583.20" y="55.50" fill="#58a6ff" textLength="92.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">STEP 5 OF 6</text>
<text x="20.40" y="73.50" fill="#98a7bb" textLength="520.80" lengthAdjust="spacingAndGlyphs">hvo-sky-install 0.9.0-dev installs CameraAgent on this machine</text>
<text x="20.40" y="109.50" fill="#3a4a60" textLength="16.80" lengthAdjust="spacingAndGlyphs">+-</text>
<text x="45.60" y="109.50" fill="#58a6ff" textLength="109.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">OWNER SIGN-IN</text>
<text x="163.20" y="109.50" fill="#3a4a60" textLength="512.40" lengthAdjust="spacingAndGlyphs">------------------------------------------------------------+</text>
<text x="20.40" y="127.50" fill="#3a4a60">|</text>
<text x="37.20" y="127.50" fill="#98a7bb" textLength="621.60" lengthAdjust="spacingAndGlyphs">The owner signs in to CameraAgent's pages first. The wizard never asks for</text>
<text x="667.20" y="127.50" fill="#3a4a60">|</text>
<text x="20.40" y="145.50" fill="#3a4a60">|</text>
<text x="37.20" y="145.50" fill="#98a7bb" textLength="344.40" lengthAdjust="spacingAndGlyphs">a password, and never shows or saves one.</text>
<text x="667.20" y="145.50" fill="#3a4a60">|</text>
<text x="20.40" y="163.50" fill="#3a4a60">|</text>
<text x="667.20" y="163.50" fill="#3a4a60">|</text>
<text x="20.40" y="181.50" fill="#3a4a60">|</text>
<text x="37.20" y="181.50" fill="#58a6ff" textLength="92.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">Owner email</text>
<text x="667.20" y="181.50" fill="#3a4a60">|</text>
<text x="20.40" y="199.50" fill="#3a4a60">|</text>
<text x="188.40" y="199.50" fill="#98a7bb" textLength="277.20" lengthAdjust="spacingAndGlyphs">empty for owner@cameraagent.local</text>
<text x="667.20" y="199.50" fill="#3a4a60">|</text>
<text x="20.40" y="217.50" fill="#3a4a60">|</text>
<text x="667.20" y="217.50" fill="#3a4a60">|</text>
<text x="20.40" y="235.50" fill="#3a4a60">|</text>
<text x="37.20" y="235.50" fill="#98a7bb" textLength="117.60" lengthAdjust="spacingAndGlyphs">First password</text>
<text x="188.40" y="235.50" fill="#f7f9fc" textLength="403.20" lengthAdjust="spacingAndGlyphs">(*) admin / skymonitor, changed at first sign-in</text>
<text x="667.20" y="235.50" fill="#3a4a60">|</text>
<text x="20.40" y="253.50" fill="#3a4a60">|</text>

<text x="20.40" y="55.50" fill="#f7f9fc" textLength="201.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">HVO SKYMONITOR INSTALLER</text>
<text x="583.20" y="55.50" fill="#58a6ff" textLength="92.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">STEP 7 OF 7</text>
<text x="20.40" y="73.50" fill="#98a7bb" textLength="520.80" lengthAdjust="spacingAndGlyphs">hvo-sky-install 0.9.0-dev installs CameraAgent on this machine</text>
<text x="20.40" y="91.50" fill="#bbf7d0" textLength="621.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">[OK] The plan can be carried out. Install saves the answers and carries it</text>
<text x="20.40" y="109.50" fill="#bbf7d0" textLength="33.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">out.</text>
<text x="45.60" y="127.50" fill="#58a6ff" textLength="126.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">REVIEW THE PLAN</text>
<text x="37.20" y="145.50" fill="#f7f9fc" textLength="588.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">Install Allsky East, instance 6f9b3c1e-2d4a-4e8b-9c7d-1a2b3c4d5e6f, at</text>
<text x="37.20" y="163.50" fill="#f7f9fc" textLength="193.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">http://127.0.0.1:5130/:</text>

<text x="20.40" y="55.50" fill="#f7f9fc" textLength="201.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">HVO SKYMONITOR INSTALLER</text>
<text x="583.20" y="55.50" fill="#58a6ff" textLength="92.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">STEP 1 OF 5</text>
<text x="20.40" y="73.50" fill="#98a7bb" textLength="520.80" lengthAdjust="spacingAndGlyphs">hvo-sky-install 0.9.0-dev installs CameraAgent on this machine</text>
<text x="20.40" y="91.50" fill="#fecaca" textLength="630.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">[ERROR] Other computers reach this address over plain HTTP: tick the box to</text>
<text x="20.40" y="109.50" fill="#fecaca" textLength="109.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">say you know.</text>
<text x="45.60" y="127.50" fill="#58a6ff" textLength="58.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">NETWORK</text>
<text x="37.20" y="145.50" fill="#98a7bb" textLength="554.40" lengthAdjust="spacingAndGlyphs">Where CameraAgent's web pages listen. 127.0.0.1 keeps them on this</text>
<text x="37.20" y="163.50" fill="#98a7bb" textLength="478.80" lengthAdjust="spacingAndGlyphs">machine; another address lets other computers reach them.</text>
<text x="37.20" y="199.50" fill="#58a6ff" textLength="58.80" lengthAdjust="spacingAndGlyphs" font-weight="bold">Address</text>
<text x="188.40" y="199.50" fill="#f7f9fc" textLength="58.80" lengthAdjust="spacingAndGlyphs">0.0.0.0</text>
<text x="37.20" y="217.50" fill="#98a7bb" textLength="33.60" lengthAdjust="spacingAndGlyphs">Port</text>
<text x="188.40" y="217.50" fill="#f7f9fc" textLength="33.60" lengthAdjust="spacingAndGlyphs">5130</text>
<text x="188.40" y="253.50" fill="#f7f9fc" textLength="436.80" lengthAdjust="spacingAndGlyphs">[ ] Other computers reach it over plain HTTP: I know</text>
<text x="28.80" y="415.50" fill="#98a7bb" textLength="67.20" lengthAdjust="spacingAndGlyphs" opacity="0.6">[ Back ]</text>
<text x="121.20" y="415.50" fill="#f7f9fc" textLength="67.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">[ Next ]</text>
<text x="20.40" y="451.50" fill="#f7f9fc" textLength="92.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">[1 Network]</text>
<text x="129.60" y="451.50" fill="#f7f9fc" textLength="84.00" lengthAdjust="spacingAndGlyphs">2 Location</text>
<text x="238.80" y="451.50" fill="#f7f9fc" textLength="67.20" lengthAdjust="spacingAndGlyphs">3 Limits</text>

<text x="20.40" y="55.50" fill="#ffffff" textLength="201.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">HVO SKYMONITOR INSTALLER</text>
<text x="583.20" y="55.50" fill="#29b8db" textLength="92.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">STEP 5 OF 6</text>
<text x="20.40" y="73.50" fill="#e5e5e5" textLength="520.80" lengthAdjust="spacingAndGlyphs">hvo-sky-install 0.9.0-dev installs CameraAgent on this machine</text>
<text x="45.60" y="109.50" fill="#29b8db" textLength="109.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">OWNER SIGN-IN</text>
<text x="37.20" y="127.50" fill="#e5e5e5" textLength="621.60" lengthAdjust="spacingAndGlyphs">The owner signs in to CameraAgent's pages first. The wizard never asks for</text>
<text x="37.20" y="145.50" fill="#e5e5e5" textLength="344.40" lengthAdjust="spacingAndGlyphs">a password, and never shows or saves one.</text>
<text x="37.20" y="181.50" fill="#29b8db" textLength="92.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">Owner email</text>
<text x="188.40" y="199.50" fill="#e5e5e5" textLength="277.20" lengthAdjust="spacingAndGlyphs">empty for owner@cameraagent.local</text>
<text x="37.20" y="235.50" fill="#e5e5e5" textLength="117.60" lengthAdjust="spacingAndGlyphs">First password</text>
<text x="188.40" y="235.50" fill="#ffffff" textLength="403.20" lengthAdjust="spacingAndGlyphs">(*) admin / skymonitor, changed at first sign-in</text>
<text x="188.40" y="253.50" fill="#ffffff" textLength="361.20" lengthAdjust="spacingAndGlyphs">( ) generated into a file only you can read</text>
<text x="188.40" y="271.50" fill="#ffffff" textLength="243.60" lengthAdjust="spacingAndGlyphs">( ) read from a file you name</text>
<text x="28.80" y="415.50" fill="#ffffff" font-weight="bold">[</text>
<text x="45.60" y="415.50" fill="#ffffff" font-weight="bold" text-decoration="underline">B</text>
<text x="54.00" y="415.50" fill="#ffffff" textLength="42.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">ack ]</text>
<text x="121.20" y="415.50" fill="#ffffff" textLength="67.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">[ Next ]</text>
<text x="28.80" y="451.50" fill="#ffffff" textLength="67.20" lengthAdjust="spacingAndGlyphs">1 Camera</text>
<text x="121.20" y="451.50" fill="#ffffff" textLength="75.60" lengthAdjust="spacingAndGlyphs">2 Network</text>
<text x="222.00" y="451.50" fill="#ffffff" textLength="84.00" lengthAdjust="spacingAndGlyphs">3 Location</text>
<text x="331.20" y="451.50" fill="#ffffff" textLength="67.20" lengthAdjust="spacingAndGlyphs">4 Limits</text>
<text x="415.20" y="451.50" fill="#ffffff" textLength="75.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">[5 Owner]</text>
<text x="507.60" y="451.50" fill="#ffffff" textLength="67.20" lengthAdjust="spacingAndGlyphs">6 Review</text>
<text x="20.40" y="469.50" fill="#ffffff" textLength="42.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">Enter</text>
<text x="70.80" y="469.50" fill="#e5e5e5" textLength="33.60" lengthAdjust="spacingAndGlyphs">next</text>
<text x="121.20" y="469.50" fill="#ffffff" textLength="42.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">Alt+B</text>
<text x="171.60" y="469.50" fill="#e5e5e5" textLength="33.60" lengthAdjust="spacingAndGlyphs">back</text>
<text x="222.00" y="469.50" fill="#ffffff" textLength="25.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">Tab</text>
<text x="255.60" y="469.50" fill="#e5e5e5" textLength="33.60" lengthAdjust="spacingAndGlyphs">move</text>
<text x="306.00" y="469.50" fill="#ffffff" textLength="25.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">Esc</text>
<text x="339.60" y="469.50" fill="#e5e5e5" textLength="50.40" lengthAdjust="spacingAndGlyphs">cancel</text>

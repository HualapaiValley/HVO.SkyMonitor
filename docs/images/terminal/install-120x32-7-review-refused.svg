<text x="20.40" y="73.50" fill="#98a7bb" textLength="520.80" lengthAdjust="spacingAndGlyphs">hvo-sky-install 0.9.0-dev installs CameraAgent on this machine</text>
<text x="768.00" y="73.50" fill="#98a7bb" textLength="243.60" lengthAdjust="spacingAndGlyphs">Nothing changes until Install</text>
<text x="20.40" y="91.50" fill="#fecaca" textLength="764.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">[REFUSED] Port 5130 on 127.0.0.1 is already in use by another program. Nothing was changed.</text>

<text x="20.40" y="55.50" fill="#f7f9fc" textLength="201.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">HVO SKYMONITOR INSTALLER</text>
<text x="583.20" y="55.50" fill="#58a6ff" textLength="92.40" lengthAdjust="spacingAndGlyphs" font-weight="bold">STEP 2 OF 7</text>
<text x="20.40" y="73.50" fill="#98a7bb" textLength="520.80" lengthAdjust="spacingAndGlyphs">hvo-sky-install 0.9.0-dev installs CameraAgent on this machine</text>
<text x="45.60" y="109.50" fill="#58a6ff" textLength="67.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">SOFTWARE</text>
<text x="37.20" y="127.50" fill="#98a7bb" textLength="621.60" lengthAdjust="spacingAndGlyphs">Where CameraAgent comes from: a release's folder (release.json, SHA256SUMS</text>
<text x="37.20" y="145.50" fill="#98a7bb" textLength="369.60" lengthAdjust="spacingAndGlyphs">and its image archive) and the star catalog.</text>
<text x="37.20" y="181.50" fill="#98a7bb" textLength="117.60" lengthAdjust="spacingAndGlyphs">Release folder</text>
<text x="188.40" y="181.50" fill="#f7f9fc" textLength="235.20" lengthAdjust="spacingAndGlyphs">/home/operator/hvo-sky-0.9.0</text>
<text x="188.40" y="199.50" fill="#98a7bb" textLength="394.80" lengthAdjust="spacingAndGlyphs">The folder holding the release's files, such as</text>
<text x="188.40" y="217.50" fill="#98a7bb" textLength="201.60" lengthAdjust="spacingAndGlyphs">/home/you/hvo-sky-0.9.0.</text>
<text x="37.20" y="235.50" fill="#98a7bb" textLength="84.00" lengthAdjust="spacingAndGlyphs">Image from</text>
<text x="188.40" y="235.50" fill="#f7f9fc" textLength="260.40" lengthAdjust="spacingAndGlyphs">(*) the release's image archive</text>
<text x="188.40" y="253.50" fill="#f7f9fc" textLength="260.40" lengthAdjust="spacingAndGlyphs">( ) the registry, by its digest</text>
<text x="37.20" y="289.50" fill="#58a6ff" textLength="117.60" lengthAdjust="spacingAndGlyphs" font-weight="bold">Catalog bundle</text>
<text x="188.40" y="289.50" fill="#f7f9fc" textLength="394.80" lengthAdjust="spacingAndGlyphs">perator/.cache/hvo-sky/hyg-v4.2-p3-s2-r1.bundle</text>
<text x="188.40" y="307.50" fill="#98a7bb" textLength="361.20" lengthAdjust="spacingAndGlyphs">The unpacked catalog's folder, NAME.bundle.</text>
<text x="28.80" y="415.50" fill="#f7f9fc" font-weight="bold">[</text>
<text x="45.60" y="415.50" fill="#f7f9fc" font-weight="bold" text-decoration="underline">B</text>
<text x="54.00" y="415.50" fill="#f7f9fc" textLength="42.00" lengthAdjust="spacingAndGlyphs" font-weight="bold">ack ]</text>
<text x="121.20" y="415.50" fill="#f7f9fc" textLength="67.20" lengthAdjust="spacingAndGlyphs" font-weight="bold">[ Next ]</text>
<text x="28.80" y="451.50" fill="#f7f9fc">1</text>

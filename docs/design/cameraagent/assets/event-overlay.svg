<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Synthetic local-candidate overlay</title>
  <desc id="description">A star field with a bright diagonal candidate track, a measured bounding box, and start and end markers.</desc>
  <defs><radialGradient id="sky" cx="50%" cy="42%" r="75%"><stop stop-color="#17345c"/><stop offset=".7" stop-color="#071226"/><stop offset="1" stop-color="#02050a"/></radialGradient><linearGradient id="track" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".1"/><stop offset=".35" stop-color="#dff7ff"/><stop offset="1" stop-color="#fff2c0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter></defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#f4f9ff"><circle cx="120" cy="130" r="2"/><circle cx="225" cy="280" r="3"/><circle cx="330" cy="105" r="2"/><circle cx="480" cy="340" r="2.5"/><circle cx="620" cy="155" r="3"/><circle cx="760" cy="300" r="2"/><circle cx="910" cy="120" r="2.5"/><circle cx="1050" cy="390" r="3"/><circle cx="180" cy="520" r="2"/><circle cx="850" cy="570" r="2.5"/></g>
  <path d="M300 610L910 195" stroke="#dff7ff" stroke-opacity=".3" stroke-width="22" filter="url(#glow)"/><path d="M300 610L910 195" stroke="url(#track)" stroke-width="6" stroke-linecap="round"/>
  <rect x="262" y="155" width="690" height="495" rx="10" fill="none" stroke="#d7a6ff" stroke-width="3" stroke-dasharray="12 8"/>
  <circle cx="300" cy="610" r="12" fill="#17253c" stroke="#76dbc4" stroke-width="4"/><circle cx="910" cy="195" r="12" fill="#17253c" stroke="#ffca66" stroke-width="4"/>
  <g fill="#d7a6ff" font-family="ui-monospace, monospace" font-size="18"><text x="275" y="145">LOCAL CANDIDATE / MEASURED TRACK</text><text x="275" y="680">DISPLAY GEOMETRY / SEE STRUCTURED MEASUREMENTS</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">Synthetic daylight dewarped horizon panorama</title><desc id="description">A dewarped daylight panorama with broken cloud, a level volcanic horizon, and north, east, south, and west labels.</desc>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#70bfdf"/><stop offset=".7" stop-color="#3d89b0"/><stop offset="1" stop-color="#1c5578"/></linearGradient><linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7fbff" stop-opacity=".9"/><stop offset="1" stop-color="#c9d9e2" stop-opacity=".35"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="8"/></filter></defs>
  <rect width="1600" height="620" fill="url(#sky)"/><g fill="url(#cloud)" filter="url(#soft)"><ellipse cx="260" cy="170" rx="190" ry="55"/><ellipse cx="720" cy="245" rx="240" ry="70"/><ellipse cx="1230" cy="145" rx="205" ry="60"/></g><circle cx="1390" cy="95" r="38" fill="#fff3b5" opacity=".88"/>
  <path d="M0 455L115 425L240 468L350 400L470 450L600 388L730 458L860 410L980 470L1110 395L1240 455L1370 420L1490 468L1600 435V620H0Z" fill="#10242f"/><path d="M0 495C260 460 420 500 650 472C920 440 1160 515 1600 470V620H0Z" fill="#07131b"/>
  <g stroke="#e9f4ff" stroke-opacity=".2"><path d="M0 310H1600"/><path d="M0 0V620M400 0V620M800 0V620M1200 0V620M1600 0V620"/></g><g fill="#e9f4ff" font-family="ui-monospace, monospace" font-size="22" text-anchor="middle"><text x="200" y="595">N</text><text x="600" y="595">E</text><text x="1000" y="595">S</text><text x="1400" y="595">W</text></g>
</svg>

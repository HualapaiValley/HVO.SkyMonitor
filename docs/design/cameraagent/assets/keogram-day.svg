<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <title id="title">Synthetic full sky-day keogram</title>
  <desc id="description">A north-zenith-south time-versus-sky strip transitioning from daylight through sunset and night to dawn, with patterned data gaps and three event markers.</desc>
  <defs>
    <linearGradient id="time" x1="0" x2="1"><stop offset="0" stop-color="#69b9dc"/><stop offset=".46" stop-color="#d7b06c"/><stop offset=".56" stop-color="#755b95"/><stop offset=".62" stop-color="#142c54"/><stop offset=".94" stop-color="#0b1832"/><stop offset="1" stop-color="#d6a96a"/></linearGradient>
    <linearGradient id="vertical" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0a1425" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#02050a" stop-opacity=".55"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter><pattern id="gap" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="5" height="12" fill="#07111f"/><rect x="5" width="3" height="12" fill="#8fa4c0"/></pattern>
  </defs>
  <rect width="1600" height="520" fill="url(#time)"/><rect width="1600" height="520" fill="url(#vertical)"/>
  <g fill="#f6fbff" opacity=".34" filter="url(#blur)"><path d="M110 170C220 80 340 250 480 138S690 220 780 150V245H100Z"/><path d="M430 330C570 225 650 395 820 290S1050 360 1170 260V390H430Z"/></g>
  <g fill="#edf6ff" opacity=".8"><circle cx="1030" cy="118" r="3"/><circle cx="1080" cy="205" r="2"/><circle cx="1160" cy="90" r="2.5"/><circle cx="1260" cy="180" r="3"/><circle cx="1360" cy="130" r="2"/><circle cx="1470" cy="240" r="2.5"/></g>
  <g stroke="#d7a6ff" stroke-width="4"><path d="M624 0V520"/><path d="M998 0V520"/><path d="M1092 0V520"/></g>
  <g><rect x="495" width="24" height="520" fill="url(#gap)"/><rect x="1248" width="32" height="520" fill="url(#gap)"/></g>
  <g stroke="#dce9ff" stroke-opacity=".12"><path d="M0 130H1600M0 260H1600M0 390H1600"/><path d="M400 0V520M800 0V520M1200 0V520"/></g>
  <g fill="#f5f9ff" font-family="ui-monospace, monospace" font-size="18"><text x="14" y="40">NORTH</text><text x="14" y="250">ZENITH</text><text x="14" y="450">SOUTH</text></g><rect y="480" width="1600" height="40" fill="#02050a" fill-opacity=".78"/><g fill="#f5f9ff" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle"><text x="55" y="507">5:54 AM</text><text x="405" y="507">NOON</text><text x="890" y="507">SUNSET</text><text x="1205" y="507">MIDNIGHT</text><text x="1540" y="507">5:55 AM</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="300 0 1000 1000" role="img" aria-labelledby="title description">
  <title id="title">Synthetic all-sky night preview</title>
  <desc id="description">A circular fisheye view of a star field above a dark volcanic horizon, with a faint Milky Way and one meteor-like streak.</desc>
  <defs>
    <radialGradient id="sky" cx="48%" cy="43%" r="58%">
      <stop offset="0" stop-color="#17305a"/>
      <stop offset="0.48" stop-color="#0c1832"/>
      <stop offset="0.82" stop-color="#07101f"/>
      <stop offset="1" stop-color="#02050b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8e7ff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#8cacdb" stop-opacity=".08"/>
      <stop offset="1" stop-color="#52709d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meteor" x1="0" x2="1">
      <stop offset="0" stop-color="#eff9ff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#dff8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="fisheye"><circle cx="800" cy="500" r="470"/></clipPath>
  </defs>

  <g fill="#9ec3ff" font-family="ui-monospace, monospace" font-size="22" text-anchor="middle"><text x="200" y="595">N</text><text x="600" y="595">E</text><text x="1000" y="595">S</text><text x="1400" y="595">W</text></g>
</svg>

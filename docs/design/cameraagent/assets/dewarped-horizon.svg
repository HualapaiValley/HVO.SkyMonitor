<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">Synthetic dewarped horizon panorama</title>
  <desc id="description">A dewarped night panorama with a level volcanic horizon and north, east, south, and west orientation labels.</desc>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142d55"/><stop offset=".7" stop-color="#071225"/><stop offset="1" stop-color="#02050a"/></linearGradient></defs>
  <rect width="1600" height="620" fill="url(#sky)"/>
  <g fill="#eff8ff"><circle cx="90" cy="160" r="3"/><circle cx="220" cy="88" r="2"/><circle cx="350" cy="205" r="3"/><circle cx="480" cy="130" r="2"/><circle cx="610" cy="245" r="2.5"/><circle cx="740" cy="100" r="3"/><circle cx="870" cy="180" r="2"/><circle cx="1000" cy="75" r="2.5"/><circle cx="1130" cy="215" r="3"/><circle cx="1260" cy="125" r="2"/><circle cx="1400" cy="230" r="3"/><circle cx="1510" cy="105" r="2"/></g>
  <path d="M0 455L115 425L240 468L350 400L470 450L600 388L730 458L860 410L980 470L1110 395L1240 455L1370 420L1490 468L1600 435V620H0Z" fill="#07121b"/>

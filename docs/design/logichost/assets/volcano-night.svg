<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title description">
  <title id="title">Synthetic Volcano Station night sky</title>
  <desc id="description">Circular all-sky view with stars, a faint Milky Way, a volcanic horizon, and one meteor-like streak.</desc>
  <defs>
    <radialGradient id="sky" cx="48%" cy="42%" r="60%"><stop stop-color="#24396b"/><stop offset=".5" stop-color="#101a38"/><stop offset="1" stop-color="#02050c"/></radialGradient>
    <linearGradient id="trail"><stop stop-color="#eff9ff" stop-opacity="0"/><stop offset=".55" stop-color="#dff8ff" stop-opacity=".55"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="lens"><circle cx="500" cy="500" r="462"/></clipPath>
  </defs>
  <rect width="1000" height="1000" fill="#020409"/>
  <g clip-path="url(#lens)">
    <rect x="38" y="38" width="924" height="924" fill="url(#sky)"/>
    <path d="M210 100C360 300 480 520 760 900" fill="none" stroke="#d7e2ff" stroke-opacity=".11" stroke-width="90" filter="url(#blur)"/>
    <g fill="#f5f9ff"><circle cx="180" cy="205" r="3"/><circle cx="270" cy="151" r="2"/><circle cx="350" cy="278" r="1.5"/><circle cx="460" cy="173" r="2.5"/><circle cx="570" cy="245" r="1.8"/><circle cx="686" cy="157" r="2.8"/><circle cx="790" cy="268" r="1.6"/><circle cx="845" cy="374" r="2.2"/><circle cx="164" cy="425" r="1.8"/><circle cx="287" cy="500" r="2.8"/><circle cx="410" cy="386" r="1.4"/><circle cx="522" cy="470" r="2.3"/><circle cx="650" cy="390" r="1.7"/><circle cx="755" cy="515" r="3"/><circle cx="875" cy="570" r="1.6"/><circle cx="202" cy="650" r="2.2"/><circle cx="338" cy="715" r="1.5"/><circle cx="482" cy="630" r="2.7"/><circle cx="610" cy="720" r="1.5"/><circle cx="737" cy="660" r="2.5"/></g>
    <path d="M790 224L622 350" stroke="url(#trail)" stroke-width="5" stroke-linecap="round"/>
    <path d="M38 820L120 790L205 811L286 755L370 796L455 738L540 787L630 750L715 795L805 742L890 785L962 808V1000H38Z" fill="#02040a"/>
  </g>
  <circle cx="500" cy="500" r="463" fill="none" stroke="#647391" stroke-opacity=".5" stroke-width="2"/>
</svg>
